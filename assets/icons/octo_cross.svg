          stroke-width="5.5" 
          stroke-linecap="round"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ЛАПКИ-ШАРИКИ (Держат диск по бокам)                      -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <path d="M106 138 C102 146 100 156 98 168 C103 166 108 154 114 144 Z"/>
    <path d="M150 138 C154 146 156 156 158 168 C153 166 148 154 142 144 Z"/>
  </g>

  <g>
    <circle cx="98" cy="170" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="96" cy="168" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <circle cx="158" cy="170" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="156" cy="168" r="2.2" fill="#FFFFFF" opacity="0.75"/>
