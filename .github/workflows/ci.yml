name: CI (Develop Tests & Cross-Platform Validation)

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/assets/**'
      - '.github/badges/**'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/assets/**'
      - '.github/badges/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_CACHE_PATH: "C:/BuildCache"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ============================================================
  # ЭТАП 1: СВЕРХБЫСТРЫЕ ТЕСТЫ ЯДРА И АУДИТ БЕЗОПАСНОСТИ (~30 СЕК)
  # ============================================================
  fast-tests:
    name: "[TESTS] Fast Core xUnit & Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "[SETUP] .NET 10 SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "[CACHE] Cache NuGet Packages"
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "[SECURITY] NuGet Dependency Vulnerability Audit"
        run: |
          echo "============================================================"
          echo "  [AUDIT] SCANNING NUGET PACKAGES FOR KNOWN VULNERABILITIES"
          echo "============================================================"
          dotnet list package --vulnerable --include-transitive

      - name: "[TESTS] Execute Client & Core xUnit Test Suite"
        run: |
          echo "============================================================"
          echo "  [TESTS] RUNNING 500+ FAST UNIT & PROTOCOL TESTS"
          echo "============================================================"
          dotnet test tests/obxodka.Client.Tests/obxodka.Client.Tests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  # ============================================================
  # ЭТАП 2: ПАРАЛЛЕЛЬНАЯ МАТРИЦА СБОРКИ ПЛАТФОРМ
  # ============================================================
  build-matrix:
    name: ${{ matrix.name }}
    needs: [ fast-tests ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            name: "[BUILD] Android MAUI Client (net10.0-android)"
            os: ubuntu-latest
          - id: windows
            name: "[BUILD] Windows MAUI Client (net10.0-windows)"
            os: windows-latest
          - id: avalonia
            name: "[BUILD] Cross-Platform Desktop (Avalonia net10.0)"
            os: ubuntu-latest

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "[CACHE-DIR] Ensure Windows Build Cache"
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\BuildCache" -Force | Out-Null

      - name: "[SETUP-JAVA] Setup Java JDK 17 (Android only)"
        if: matrix.id == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: "[SETUP-DOTNET] Setup .NET 10 SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: "[CACHE] Cache NuGet Packages"
        uses: actions/cache@v4
        with:
          path: ${{ matrix.os == 'windows-latest' && '~/.nuget/packages' || '~/.nuget/packages' }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "[WORKLOAD] Install MAUI Android Workload"
        if: matrix.id == 'android'
        run: dotnet workload install maui-android

      - name: "[WORKLOAD] Install MAUI Windows Workload"
        if: matrix.id == 'windows'
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: "[COMPILE-ANDROID] Build Android MAUI Package"
        if: matrix.id == 'android'
        run: dotnet build src/apps/obxodka.Maui/obxodka.Maui.csproj -f net10.0-android -c Release

      - name: "[COMPILE-WINDOWS] Build Windows MAUI Package"
        if: matrix.id == 'windows'
        run: dotnet build src/apps/obxodka.Maui/obxodka.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release

      - name: "[COMPILE-AVALONIA] Build Cross-Platform Avalonia App"
        if: matrix.id == 'avalonia'
        run: dotnet build src/apps/obxodka.Avalonia/obxodka.Avalonia.csproj -c Release

  # ============================================================
  # ЭТАП 3: ИНТЕРАКТИВНАЯ СВОДКА ДАШБОРДА CI
  # ============================================================
  ci-summary:
    name: "[SUMMARY] Pipeline Status Dashboard"
    needs: [ fast-tests, build-matrix ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "[DASHBOARD] Generate Executive Summary"
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Obxodka Continuous Integration Dashboard

          | Stage | Target | Result | Platform |
          |---|---|---|---|
          | ⚡ **Core Tests** | Unit & Protocol Tests (513) | ${{ needs.fast-tests.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | Linux Ubuntu (.NET 10) |
          | 🛡️ **Security** | NuGet Vulnerability Audit | ${{ needs.fast-tests.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | Official CVE Database |
          | 📱 **Android** | MAUI App (`net10.0-android`) | ${{ needs.build-matrix.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | Google Android Workload |
          | 🪟 **Windows** | MAUI App (`net10.0-windows`) | ${{ needs.build-matrix.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | Windows Desktop Workload |
          | 🖥️ **Desktop** | Avalonia UI (`net10.0`) | ${{ needs.build-matrix.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | Multi-Platform Avalonia |

          ---
          *Triggered by commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`.*
          EOF
