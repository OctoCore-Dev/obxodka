name: Obxodka Multi-Store Release Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - feat/dotnet11
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/assets/**'
      - '.github/badges/**'
      - 'docs/**'
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Target platform to build and release"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
          - linux
          - cli
      version_name:
        description: "Override application display version (leave blank to use version.props)"
        required: false
        default: ""
        type: string
      android_track:
        description: "Google Play Release Track"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      publish_to_stores:
        description: "Publish automatically to Microsoft Store & Google Play Store"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Dry run (build and test without publishing to stores)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: obxodka-store-release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ============================================================
  # [STAGE 0] PRE-FLIGHT VERSION INSPECTION & VALIDATION
  # ============================================================
  check-version:
    name: "[PREFLIGHT] Version & Branch Validation"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build_number: ${{ steps.check.outputs.build_number }}
      tag: ${{ steps.check.outputs.tag }}
      release_title: ${{ steps.check.outputs.release_title }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 5

      - name: "[PREFLIGHT] Inspect Version & Check Bump"
        id: check
        shell: bash
        run: |
          CYAN='\033[1;36m'
          GREEN='\033[1;32m'
          RED='\033[1;31m'
          RESET='\033[0m'

          echo -e "${CYAN}============================================================${RESET}"
          echo -e "${CYAN}  [PREFLIGHT] OBXODKA VERSION & BRANCH VALIDATOR${RESET}"
          echo -e "${CYAN}============================================================${RESET}"

          PROPS="version.props"
          if [ ! -f "$PROPS" ]; then
            echo -e "${RED}[ERROR] File $PROPS not found!${RESET}"
            echo "::error::[ERROR] $PROPS not found!"
            exit 1
          fi

          CUR_VER=$(grep -oPm1 "(?<=<AppVersion>)[^<]+" "$PROPS" || true)
          CUR_BUILD=$(grep -oPm1 "(?<=<AppBuildNumber>)[^<]+" "$PROPS" || true)

          if [ -z "$CUR_VER" ] || [ -z "$CUR_BUILD" ]; then
            echo -e "${RED}[ERROR] Failed to parse <AppVersion> or <AppBuildNumber> from $PROPS${RESET}"
            echo "::error::[ERROR] Failed to parse <AppVersion> or <AppBuildNumber> from $PROPS"
            exit 1
          fi

          echo -e "${CYAN}[INFO] Target Version:${RESET} $CUR_VER"
          echo -e "${CYAN}[INFO] Build Number:${RESET} $CUR_BUILD"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            PREV_PROPS=$(git show HEAD~1:"$PROPS" 2>/dev/null || echo "")
            if [ -n "$PREV_PROPS" ]; then
              PREV_BUILD=$(echo "$PREV_PROPS" | grep -oPm1 "(?<=<AppBuildNumber>)[^<]+" || echo "")
              if [ -n "$PREV_BUILD" ] && [ "$CUR_BUILD" -le "$PREV_BUILD" ] 2>/dev/null; then
                if [ "${{ github.ref_name }}" = "develop" ] || [ "${{ github.ref_name }}" = "feat/dotnet11" ]; then
                  echo -e "${CYAN}[INFO] Build number ($CUR_BUILD) <= previous commit ($PREV_BUILD) on ${{ github.ref_name }}.${RESET}"
                  echo -e "${CYAN}[INFO] Regular code push: skipping automated release pipeline.${RESET}"
                  echo "should_release=false" >> $GITHUB_OUTPUT
                  exit 0
                fi
                echo -e "${RED}============================================================${RESET}"
                echo -e "${RED}  [BUILD CONFLICT] Build number $CUR_BUILD <= previous commit $PREV_BUILD!${RESET}"
                echo -e "${RED}  Google Play and Microsoft Store will reject duplicate build codes.${RESET}"
                echo -e "${RED}  Please increment <AppBuildNumber> in version.props before push.${RESET}"
                echo -e "${RED}============================================================${RESET}"
                echo "::error::[VERSION CONFLICT] Current build number ($CUR_BUILD) <= previous commit ($PREV_BUILD). Increment <AppBuildNumber> in version.props."
                exit 1
              fi
            fi
          fi

          echo -e "${GREEN}[SUCCESS] Version validation passed: v$CUR_VER (Build $CUR_BUILD)${RESET}"

          BRANCH="${{ github.ref_name }}"
          IS_DEV="false"
          TAG_NAME="v$CUR_VER"
          REL_TITLE="Obxodka v$CUR_VER (Build $CUR_BUILD)"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="$BRANCH"
            if [[ "$BRANCH" == *"-"* ]]; then
              IS_DEV="true"
              REL_TITLE="Obxodka v$CUR_VER Pre-Release (Build $CUR_BUILD)"
            fi
          elif [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
            IS_DEV="true"
            TAG_NAME="v$CUR_VER-build.$CUR_BUILD"
            REL_TITLE="Obxodka v$CUR_VER Pre-Release (Build $CUR_BUILD)"
          fi

          echo "version=$CUR_VER" >> $GITHUB_OUTPUT
          echo "build_number=$CUR_BUILD" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_title=$REL_TITLE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_DEV" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### [PREFLIGHT] Inspection Report
          | Parameter | Value | Status |
          |---|---|---|
          | **Target Version** | \`v$CUR_VER\` | \`[OK]\` |
          | **Build Code** | \`$CUR_BUILD\` | \`[OK]\` |
          | **Release Tag** | \`$TAG_NAME\` | \`[OK]\` |
          | **Pre-Release** | \`$IS_DEV\` | \`[OK]\` |
          | **Branch** | \`$BRANCH\` | \`[OK]\` |
          | **Trigger Event** | \`${{ github.event_name }}\` | \`[OK]\` |
          EOF

  # ============================================================
  # [STAGE 1] AUTOMATED UNIT & CRYPTO TESTS
  # ============================================================
  run-tests:
    name: "[TESTS] Automated Client xUnit Suite"
    needs: [ check-version ]
    if: needs.check-version.outputs.should_release != 'false'
    runs-on: windows-latest
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "[SETUP] Ensure Build Cache Directory"
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "build-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          "BUILD_CACHE_PATH=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[CACHE] NuGet Package Dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '.nuget/locks/*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "[WORKLOAD] Install MAUI Windows Workload"
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: "[TEST] Execute xUnit Test Runner"
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [TESTS] RUNNING OBXODKA CLIENT XUNIT TEST SUITE" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          dotnet test tests/obxodka.Client.Tests/obxodka.Client.Tests.csproj -c Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] Client unit tests failed!"
            exit 1
          }
          Write-Host "[SUCCESS] All unit and cryptographic tests passed successfully." -ForegroundColor Green

  # ============================================================
  # [STAGE 2] BUILD ANDROID (AAB FOR STORE & APK FOR SIDELOAD)
  # ============================================================
  build-android:
    name: "[BUILD-ANDROID] MAUI AAB & APK Packages"
    needs: [ check-version, run-tests ]
    runs-on: ubuntu-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform == 'all' || inputs.target_platform == 'android')
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "[SETUP] Microsoft OpenJDK 21"
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[CACHE] NuGet Package Dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '.nuget/locks/*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "[WORKLOAD] Install MAUI Android Workload"
        run: |
          dotnet workload install maui-android

      - name: "[KEYSTORE] Decode Android Release Keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/keystore/release.keystore
            echo "[INFO] Android keystore restored successfully."
          else
            echo "::warning::[WARN] ANDROID_KEYSTORE_BASE64 secret not found! Unsigned build mode will be used."
          fi

      - name: "[CHANGELOG] Prepare WhatsNew Release Notes"
        run: |
          mkdir -p packaging/whatsnew
          if [ ! -s packaging/whatsnew/whatsnew-ru-RU ]; then
            git log -1 --pretty=%B > packaging/whatsnew/whatsnew-ru-RU
          fi
          if [ ! -s packaging/whatsnew/whatsnew-en-US ]; then
            git log -1 --pretty=%B > packaging/whatsnew/whatsnew-en-US
          fi

      - name: "[COMPILE] Build Android AAB & Standalone APK"
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          CYAN='\033[1;36m'
          GREEN='\033[1;32m'
          RESET='\033[0m'

          EXTRA_ARGS=""
          if [ -n "$VERSION_NAME" ]; then
            EXTRA_ARGS="-p:ApplicationDisplayVersion=$VERSION_NAME -p:Version=$VERSION_NAME"
          fi

          if [ "${{ needs.check-version.outputs.is_prerelease }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -p:IsTestingBuild=true"
          fi

          SIGNING_ARGS=""
          if [ -f "$HOME/keystore/release.keystore" ] && [ -n "$KEY_PASS" ] && [ -n "$STORE_PASS" ]; then
            SIGNING_ARGS="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$HOME/keystore/release.keystore -p:AndroidSigningKeyAlias=${KEY_ALIAS:-octocore} -p:AndroidSigningKeyPass=$KEY_PASS -p:AndroidSigningStorePass=$STORE_PASS"
          elif [ "${{ needs.check-version.outputs.is_prerelease }}" != "true" ]; then
            echo "::error::[FAIL] Production Android release requires ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASS, and ANDROID_STORE_PASS!"
            exit 1
          else
            echo "[WARN] Signing credentials incomplete; proceeding with unsigned pre-release artifact."
          fi

          echo -e "${CYAN}============================================================${RESET}"
          echo -e "${CYAN}  [BUILD] COMPILING ANDROID APP BUNDLE (AAB)${RESET}"
          echo -e "${CYAN}============================================================${RESET}"

          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net11.0-android -c Release \
            -p:EnableMauiLinux=true \
            $SIGNING_ARGS \
            $EXTRA_ARGS

          echo -e "${CYAN}============================================================${RESET}"
          echo -e "${CYAN}  [BUILD] COMPILING STANDALONE APK${RESET}"
          echo -e "${CYAN}============================================================${RESET}"

          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net11.0-android -c Release \
            -p:EnableMauiLinux=true \
            -p:AndroidPackageFormat=apk \
            $SIGNING_ARGS \
            $EXTRA_ARGS

          echo -e "${GREEN}[SUCCESS] Android packages built successfully.${RESET}"

      - name: "[HASH] Locate Android Packages & Compute SHA256"
        id: find-pkgs
        run: |
          mkdir -p ./android-dist
          SEARCH_DIRS=("./artifacts" "$HOME/.cache" "/home/runner/.cache" ".")
          if [ -n "${BUILD_CACHE_PATH:-}" ]; then
            SEARCH_DIRS=("$BUILD_CACHE_PATH" "${SEARCH_DIRS[@]}")
          fi
          AAB_FILE=$(find "${SEARCH_DIRS[@]}" -type f -name "*Signed.aab" 2>/dev/null | grep -v "/obj/" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find "${SEARCH_DIRS[@]}" -type f -name "*.aab" 2>/dev/null | grep -v "/obj/" | head -n 1)
          fi
          if [ -z "$AAB_FILE" ]; then
            echo "::error::[ERROR] No AAB bundle found!"
            exit 1
          fi
          cp "$AAB_FILE" ./android-dist/Obxodka-Release.aab
          echo "[INFO] Located AAB: $AAB_FILE -> ./android-dist/Obxodka-Release.aab"

          APK_FILE=$(find "${SEARCH_DIRS[@]}" -type f -name "*Signed.apk" 2>/dev/null | grep -v "/obj/" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find "${SEARCH_DIRS[@]}" -type f -name "*.apk" 2>/dev/null | grep -v "/obj/" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./android-dist/Obxodka-Android.apk
            echo "[INFO] Located APK: $APK_FILE -> ./android-dist/Obxodka-Android.apk"
          fi

          cd ./android-dist
          sha256sum * > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: "[AUDIT] Verify AAB 16KB ELF Alignment, R8 >= 25%, JNI & Debug Symbols"
        run: |
          JNI_RULES=$(find "${BUILD_CACHE_PATH:-./artifacts}" ./artifacts -type f -name "proguard_jni_auto.cfg" 2>/dev/null | head -n 1 || true)
          JNI_ARG=""
          if [ -n "$JNI_RULES" ]; then
            JNI_ARG="--jni-rules $JNI_RULES"
          fi
          dotnet run --file tools/AndroidR8Optimizer.cs \
            -p:ImportDirectoryBuildProps=false \
            -p:ImportDirectoryBuildTargets=false \
            -p:ImportDirectoryPackagesProps=false \
            -- --audit ./android-dist/Obxodka-Release.aab --min-r8 25 $JNI_ARG

      - name: "[ARTIFACT] Upload Android Dist Package"
        uses: actions/upload-artifact@v7
        with:
          name: obxodka-android-dist
          path: ./android-dist/*
          retention-days: 14

  # ============================================================
  # [STAGE 3] BUILD WINDOWS (STORE MSIX & INNO SETUP INSTALLER)
  # ============================================================
  build-windows:
    name: "[BUILD-WINDOWS] MAUI MSIX & Setup EXE"
    needs: [ check-version, run-tests ]
    runs-on: windows-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform == 'all' || inputs.target_platform == 'windows')
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "[SETUP] Ensure Build Cache Directory"
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "build-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          "BUILD_CACHE_PATH=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[CACHE] NuGet Package Dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '.nuget/locks/*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "[WORKLOAD] Install MAUI Windows Workload"
        run: |
          dotnet workload install maui-windows --skip-manifest-update

      - name: "[COMPILE] Build MSIX Store Package"
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [BUILD] COMPILING WINDOWS STORE MSIX PACKAGE" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan

          $extraArgs = @()
          if ($env:VERSION_NAME) {
            $extraArgs += "-p:ApplicationDisplayVersion=$env:VERSION_NAME"
            $extraArgs += "-p:Version=$env:VERSION_NAME"
          }

          if ("${{ needs.check-version.outputs.is_prerelease }}" -eq "true") {
            $extraArgs += "-p:IsTestingBuild=true"
          }

          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net11.0-windows10.0.19041.0 -c Release `
            -p:BuildWindowsOnly=true `
            -p:PackageMode=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms="x64" `
            -p:UapAppxPackageBuildMode=StoreUpload `
            $extraArgs

      - name: "[LOCATE] Resolve Windows Store Package Path"
        id: find-windows-pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./win-dist" -Force | Out-Null
          $searchPaths = @("src/apps/obxodka.Maui/AppPackages", "AppPackages", "artifacts")
          if ($env:BUILD_CACHE_PATH) { $searchPaths += $env:BUILD_CACHE_PATH }
          $pkg = Get-ChildItem -Path $searchPaths -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "\\obj\\" -and $_.Name -notmatch "scale-" } | Select-Object -First 1
          if (-not $pkg) {
            $pkg = Get-ChildItem -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" | Where-Object { $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          }
          if ($pkg) {
            Write-Host "[INFO] Found Store Package: $($pkg.FullName)" -ForegroundColor Cyan

            # Verify MSIX payload: obxodka.Maui.exe must be Windows GUI (Subsystem=2) and SplashScreen image must exist
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $tmpDir = Join-Path $env:RUNNER_TEMP "msix-verify"
            Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null

            $currentArchive = $pkg.FullName
            $verified = $false
            for ($depth = 0; $depth -lt 4; $depth++) {
              $zip = [IO.Compression.ZipFile]::OpenRead($currentArchive)
              try {
                if ($zip.GetEntry("AppxManifest.xml") -and $zip.GetEntry("obxodka.Maui.exe")) {
                  $exeStream = $zip.GetEntry("obxodka.Maui.exe").Open()
                  $ms = [IO.MemoryStream]::new()
                  $exeStream.CopyTo($ms)
                  $exeStream.Dispose()
                  $bytes = $ms.ToArray()
                  $ms.Dispose()
                  $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
                  $subsys = [BitConverter]::ToUInt16($bytes, $peOff + 24 + 68)
                  if ($subsys -ne 2) {
                    Write-Error "[FAIL] MSIX obxodka.Maui.exe has PE Subsystem=$subsys (expected 2=Windows GUI, 3=Console would open terminal)!"
                    exit 1
                  }
                  Write-Host "[VERIFY] MSIX obxodka.Maui.exe PE Subsystem = $subsys (Windows GUI) [OK]" -ForegroundColor Green

                  $sr = [IO.StreamReader]::new($zip.GetEntry("AppxManifest.xml").Open())
                  [xml]$manifestXml = $sr.ReadToEnd()
                  $sr.Dispose()
                  $ns = [System.Xml.XmlNamespaceManager]::new($manifestXml.NameTable)
                  $ns.AddNamespace("uap", "http://schemas.microsoft.com/appx/manifest/uap/windows10")
                  $splashNode = $manifestXml.SelectSingleNode("//uap:SplashScreen", $ns)
                  if ($splashNode) {
                    $splashImg = $splashNode.GetAttribute("Image")
                    $splashBase = [IO.Path]::GetFileNameWithoutExtension($splashImg)
                    $splashExt = [IO.Path]::GetExtension($splashImg)
                    $matched = $zip.Entries | Where-Object {
                      $_.FullName -ieq $splashImg -or $_.FullName -ilike "$splashBase.scale-*$splashExt"
                    }
                    if (-not $matched) {
                      Write-Error "[FAIL] MSIX AppxManifest.xml references SplashScreen '$splashImg', but no matching asset exists inside MSIX (causes Store error 0x80073CF6)!"
                      exit 1
                    }
                    Write-Host "[VERIFY] MSIX SplashScreen '$splashImg' matched asset(s): $(($matched | ForEach-Object FullName) -join ', ') [OK]" -ForegroundColor Green
                  }
                  $verified = $true
                  break
                }

                $nested = $zip.Entries | Where-Object { $_.FullName -like "*_x64.msix" -or $_.FullName -like "*.msixbundle" -or $_.FullName -like "*.msix" } | Where-Object { $_.FullName -notlike "*scale-*" } | Select-Object -First 1
                if (-not $nested) {
                  Write-Error "[FAIL] Could not locate inner x64 MSIX inside $($pkg.Name) for verification!"
                  exit 1
                }
                $nextPath = Join-Path $tmpDir ("layer_" + $depth + "_" + [IO.Path]::GetFileName($nested.FullName))
                [IO.Compression.ZipFileExtensions]::ExtractToFile($nested, $nextPath, $true)
                $currentArchive = $nextPath
              } finally {
                $zip.Dispose()
              }
            }
            Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
            if (-not $verified) {
              Write-Error "[FAIL] MSIX verification did not reach AppxManifest.xml / obxodka.Maui.exe!"
              exit 1
            }

            Copy-Item -Path $pkg.FullName -Destination "./win-dist/$($pkg.Name)"
            echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
            echo "pkg_name=$($pkg.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "[FAIL] Windows Store package not found!"
            exit 1
          }

      - name: "[INSTALLER] Compile Inno Setup Executable"
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [BUILD] COMPILING STANDALONE INNO SETUP INSTALLER" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan

          $ver = $env:VERSION_NAME
          if (-not $ver) {
            $ver = (Select-String -Path "version.props" -Pattern "<AppVersion>(.*)</AppVersion>").Matches.Groups[1].Value
          }
          if (-not $ver) { $ver = "6.0.8" }

          $unpackagedArgs = @()
          if ("${{ needs.check-version.outputs.is_prerelease }}" -eq "true") {
            $unpackagedArgs += "-p:IsTestingBuild=true"
          }

          # Clean MSIX intermediate/output artifacts so unpackaged build never inherits packaged state
          $artifactsRoot = if ($env:BUILD_CACHE_PATH) { Join-Path $env:BUILD_CACHE_PATH "obxodka" } else { "artifacts" }
          Remove-Item (Join-Path $artifactsRoot "obj/obxodka.Maui") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $artifactsRoot "bin/obxodka.Maui") -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "[INFO] Publishing unpackaged Windows binary v$ver..." -ForegroundColor Cyan
          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net11.0-windows10.0.19041.0 -c Release `
            -p:BuildWindowsOnly=true `
            -p:PackageMode=None `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            $unpackagedArgs `
            -o ./win-unpackaged

          $unpackagedExe = "./win-unpackaged/obxodka.Maui.exe"
          if (-not (Test-Path $unpackagedExe)) {
            Write-Error "[FAIL] Unpackaged obxodka.Maui.exe not found!"
            exit 1
          }
          $exeBytes = [IO.File]::ReadAllBytes((Resolve-Path $unpackagedExe))
          $exePeOff = [BitConverter]::ToInt32($exeBytes, 0x3C)
          $exeSubsys = [BitConverter]::ToUInt16($exeBytes, $exePeOff + 24 + 68)
          if ($exeSubsys -ne 2) {
            Write-Error "[FAIL] Unpackaged obxodka.Maui.exe has PE Subsystem=$exeSubsys (expected 2=Windows GUI, 3=Console would open terminal)!"
            exit 1
          }
          Write-Host "[VERIFY] Unpackaged obxodka.Maui.exe PE Subsystem = $exeSubsys (Windows GUI) [OK]" -ForegroundColor Green

          Write-Host "[INFO] Executing Inno Setup compiler (ISCC)..." -ForegroundColor Cyan
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          & $iscc "/DMyAppVersion=$ver" installer/obxodka.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] Inno Setup compiler exited with code $LASTEXITCODE!"
            exit $LASTEXITCODE
          }

          if (Test-Path "installer-output/Obxodka-Setup.exe") {
            if ($env:WINDOWS_CODESIGN_PFX_BASE64 -and $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
              Write-Host "[SIGN] Signing Obxodka-Setup.exe with Authenticode certificate..." -ForegroundColor Cyan
              $pfxPath = Join-Path $env:RUNNER_TEMP "obxodka-codesign.pfx"
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
              try {
                $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if (-not $signtool) {
                  Write-Error "[FAIL] signtool.exe not found!"
                  exit 1
                }
                & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 "installer-output/Obxodka-Setup.exe"
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "[FAIL] signtool.exe failed with exit code $LASTEXITCODE!"
                  exit $LASTEXITCODE
                }
              } finally {
                Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
              }
            } else {
              Write-Host "::warning::[SIGN] WINDOWS_CODESIGN_PFX_BASE64 secret not configured — Obxodka-Setup.exe is unsigned."
            }

            Write-Host "[SUCCESS] Installer created: installer-output/Obxodka-Setup.exe" -ForegroundColor Green
            Copy-Item -Path "installer-output/Obxodka-Setup.exe" -Destination "./win-dist/Obxodka-Setup.exe"
          } else {
            Write-Error "[FAIL] Failed to generate Obxodka-Setup.exe!"
            exit 1
          }

      - name: "[HASH] Generate Windows SHA256 Checksums"
        shell: pwsh
        run: |
          Get-ChildItem -Path "./win-dist" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "./win-dist/SHA256SUMS-windows.txt" -Append -Encoding ascii
          }
          Get-Content "./win-dist/SHA256SUMS-windows.txt"

      - name: "[ARTIFACT] Upload Windows Dist Package"
        uses: actions/upload-artifact@v7
        with:
          name: obxodka-windows-dist
          path: ./win-dist/*
          retention-days: 14

  # ============================================================
  # [STAGE 4] DEPLOY ANDROID TO GOOGLE PLAY VIA OCTOPUBLISHER
  # ============================================================
  deploy-android:
    name: "[PUBLISH-ANDROID] Google Play Console (OctoPublisher)"
    needs: [ check-version, build-android ]
    runs-on: ubuntu-latest
    outputs:
      deploy_state: ${{ steps.publish-play.outputs.deploy_state }}
    if: |
      always() &&
      (needs.check-version.outputs.should_release != 'false') &&
      (needs.build-android.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform != 'windows') &&
      (github.event_name == 'push' || inputs.publish_to_stores == true) &&
      (inputs.dry_run != true)
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
      PLAY_PACKAGE_NAME: ${{ secrets.PLAY_PACKAGE_NAME || 'com.octocore.obxodka' }}
      ANDROID_TRACK: ${{ inputs.android_track || ((github.ref_name == 'main' || github.ref_name == 'master') && 'production' || 'internal') }}

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7

      - name: "[SETUP] .NET 10 + 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: "[TOOL] Install OctoPublisher Global Tool"
        run: |
          dotnet tool install -g octopublisher || dotnet tool update -g octopublisher
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.dotnet/tools"
          octopublish --version

      - name: "[DOWNLOAD] Download Android Dist Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: obxodka-android-dist
          path: ./android-dist

      - name: "[RESOLVE] Locate AAB Package File"
        id: find-aab
        run: |
          AAB_FILE=$(find ./android-dist -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::[ERROR] No AAB bundle found in downloaded artifact!"
            exit 1
          fi
          echo "[INFO] Found AAB target: $AAB_FILE"
          echo "aab_path=$(realpath "$AAB_FILE")" >> $GITHUB_OUTPUT

      - name: "[PUBLISH] OctoPublisher Play Store Engine"
        if: ${{ env.PLAY_CONFIG_JSON != '' }}
        id: publish-play
        run: |
          CYAN='\033[1;36m'
          RESET='\033[0m'
          export PATH="$PATH:$HOME/.dotnet/tools"

          echo -e "${CYAN}============================================================${RESET}"
          echo -e "${CYAN}  [OCTOPUBLISHER] DEPLOYING TO GOOGLE PLAY STORE${RESET}"
          echo -e "${CYAN}============================================================${RESET}"

          EXIT_CODE=0
          octopublish playstore publish \
            --bundle "${{ steps.find-aab.outputs.aab_path }}" \
            --package-name "$PLAY_PACKAGE_NAME" \
            --service-account "$PLAY_CONFIG_JSON" \
            --track "$ANDROID_TRACK" \
            --notes-dir "packaging/whatsnew" \
            --desc-dir "packaging/store/android" \
            --release-name "v${{ needs.check-version.outputs.version }} (Build ${{ needs.check-version.outputs.build_number }})" || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 3 ]; then
            echo "::warning::[STORE BUSY] Google Play track is currently pending review. Queued for watchdog auto-deploy."
            echo "deploy_state=queued" >> $GITHUB_OUTPUT
            exit 0
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::[STORE ERROR] Google Play publication failed with exit code $EXIT_CODE."
            echo "deploy_state=failed" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          else
            echo "deploy_state=deployed" >> $GITHUB_OUTPUT
          fi

      - name: "[TELEMETRY] Google Play Deployment Telemetry"
        if: always()
        run: |
          DEPLOY_STATE="${{ steps.publish-play.outputs.deploy_state }}"
          STATUS="${{ steps.publish-play.outcome }}"
          STATUS_TAG="[PASS] DEPLOYED"
          if [ "$DEPLOY_STATE" = "queued" ]; then
            STATUS_TAG="[QUEUED] PENDING STORE REVIEW"
          elif [ "$DEPLOY_STATE" = "failed" ] || [ "$STATUS" != "success" ]; then
            STATUS_TAG="[FAIL] ERROR"
            if [ -z "$PLAY_CONFIG_JSON" ]; then
              STATUS_TAG="[SKIP] SKIPPED (PLAY_CONFIG_JSON secret not configured)"
            fi
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### [PUBLISH] Google Play Store (OctoPublisher)
          | Parameter | Value |
          |---|---|
          | **Status** | \`$STATUS_TAG\` |
          | **Engine** | OctoPublisher CLI (.NET 10) |
          | **Package Name** | \`$PLAY_PACKAGE_NAME\` |
          | **Release Track** | \`$ANDROID_TRACK\` |
          | **Version** | \`v${{ needs.check-version.outputs.version }}\` (Build \`${{ needs.check-version.outputs.build_number }}\`) |
          | **Play Console** | [Open Play Console](https://play.google.com/console/u/0/developers/) |
          EOF

  # ============================================================
  # [STAGE 5] DEPLOY WINDOWS TO MICROSOFT STORE VIA OCTOPUBLISHER
  # ============================================================
  deploy-windows:
    name: "[PUBLISH-WINDOWS] Microsoft Partner Center (OctoPublisher)"
    needs: [ check-version, build-windows ]
    runs-on: windows-latest
    outputs:
      deploy_state: ${{ steps.publish-mstore.outputs.deploy_state }}
    if: |
      always() &&
      (needs.check-version.outputs.should_release != 'false') &&
      (needs.build-windows.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform != 'android') &&
      (github.ref_name == 'main' || github.ref_name == 'master' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_stores == true)) &&
      (inputs.dry_run != true)
    env:
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_APP_ID: ${{ secrets.STORE_APP_ID || '9NZXP5WR803J' }}
      SELLER_ID: ${{ secrets.SELLER_ID || '94042650' }}

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7

      - name: "[SETUP] .NET 10 + 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: "[TOOL] Install OctoPublisher Global Tool"
        shell: pwsh
        run: |
          dotnet tool install -g octopublisher || dotnet tool update -g octopublisher
          octopublish --version

      - name: "[DOWNLOAD] Download Windows Dist Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: obxodka-windows-dist
          path: ./win-dist

      - name: "[RESOLVE] Locate MSIX Store Package File"
        id: find-windows-pkg
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "./win-dist" -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" | Select-Object -First 1
          if ($pkg) {
            Write-Host "[INFO] Located Store target: $($pkg.FullName)" -ForegroundColor Cyan
            echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
            echo "pkg_name=$($pkg.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "[FAIL] Windows Store package not found in downloaded artifact!"
            exit 1
          }

      - name: "[PUBLISH] OctoPublisher Microsoft Store Engine"
        if: ${{ env.STORE_CLIENT_ID != '' }}
        id: publish-mstore
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [OCTOPUBLISHER] DEPLOYING TO MICROSOFT STORE" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan

          $exitCode = 0
          try {
            # Пробуем очистить зависший черновик перед публикацией на случай предыдущего CommitFailed
            try {
              octopublish mstore delete-draft `
                --app-id "$env:STORE_APP_ID" `
                --tenant-id "$env:STORE_TENANT_ID" `
                --client-id "$env:STORE_CLIENT_ID" `
                --client-secret "$env:STORE_CLIENT_SECRET"
            } catch {
              Write-Host "[INFO] No dangling drafts found to clean." -ForegroundColor Gray
            }

            octopublish mstore publish `
              --package "${{ steps.find-windows-pkg.outputs.pkg_path }}" `
              --app-id "$env:STORE_APP_ID" `
              --tenant-id "$env:STORE_TENANT_ID" `
              --client-id "$env:STORE_CLIENT_ID" `
              --client-secret "$env:STORE_CLIENT_SECRET" `
              --seller-id "$env:SELLER_ID" `
              --notes-dir "packaging/whatsnew" `
              --desc-dir "packaging/store/windows"
            $exitCode = $LASTEXITCODE

            if ($exitCode -ne 0 -and $exitCode -ne 3) {
              Write-Host "::warning::[STORE RETRY] Initial publish returned exit code $exitCode. Deleting draft and retrying..." -ForegroundColor Yellow
              try {
                octopublish mstore delete-draft `
                  --app-id "$env:STORE_APP_ID" `
                  --tenant-id "$env:STORE_TENANT_ID" `
                  --client-id "$env:STORE_CLIENT_ID" `
                  --client-secret "$env:STORE_CLIENT_SECRET"

                octopublish mstore publish `
                  --package "${{ steps.find-windows-pkg.outputs.pkg_path }}" `
                  --app-id "$env:STORE_APP_ID" `
                  --tenant-id "$env:STORE_TENANT_ID" `
                  --client-id "$env:STORE_CLIENT_ID" `
                  --client-secret "$env:STORE_CLIENT_SECRET" `
                  --seller-id "$env:SELLER_ID" `
                  --notes-dir "packaging/whatsnew" `
                  --desc-dir "packaging/store/windows"
                $exitCode = $LASTEXITCODE
              } catch { }
            }
          } catch {
            $exitCode = 1
          }

          if ($exitCode -eq 3) {
            Write-Host "::warning::[STORE BUSY] Microsoft Store submission is currently in review/processing. Queued for autonomous deployment."
            "deploy_state=queued" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          } elseif ($exitCode -ne 0) {
            Write-Host "::error::[STORE ERROR] Microsoft Store publication failed with exit code $exitCode."
            "deploy_state=failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit $exitCode
          } else {
            "deploy_state=deployed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

      - name: "[TELEMETRY] Microsoft Store Deployment Telemetry"
        if: always()
        shell: pwsh
        run: |
          $deployState = "${{ steps.publish-mstore.outputs.deploy_state }}"
          $status = "${{ steps.publish-mstore.outcome }}"
          $statusTag = "[PASS] COMMITTED TO CERTIFICATION"
          if ($deployState -eq "queued") {
            $statusTag = "[QUEUED] PENDING STORE REVIEW"
          } elseif ($deployState -eq "failed" -or $status -ne "success") {
            $statusTag = "[FAIL] ERROR"
            if (-not $env:STORE_CLIENT_ID) {
              $statusTag = "[SKIP] SKIPPED (STORE_CLIENT_ID secret not configured)"
            }
          }

          $summary = @"
          ### [PUBLISH] Microsoft Store (OctoPublisher)
          | Parameter | Value |
          |---|---|
          | **Status** | `$statusTag` |
          | **Engine** | OctoPublisher CLI (.NET 10) |
          | **App ID** | `$env:STORE_APP_ID` |
          | **Seller ID** | `$env:SELLER_ID` |
          | **Package** | `${{ steps.find-windows-pkg.outputs.pkg_name }}` |
          | **Partner Center** | [Open Partner Center](https://partner.microsoft.com/dashboard/products/$env:STORE_APP_ID/overview) |
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ============================================================
  # [STAGE 5B] BUILD CROSS-PLATFORM CLI (WIN ZIP + LINUX DEB/RPM/PACMAN)
  # ============================================================
  build-cli:
    name: "[BUILD-CLI] Cross-Platform CLI (Win ZIP & Linux DEB/RPM/Pacman)"
    needs: [ check-version, run-tests ]
    runs-on: ubuntu-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform == 'all' || inputs.target_platform == 'cli' || inputs.target_platform == 'linux' || inputs.target_platform == 'windows')
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "[SETUP] Ensure Build Cache Directory"
        run: |
          CACHE_DIR="${RUNNER_TEMP}/build-cache"
          mkdir -p "$CACHE_DIR"
          echo "BUILD_CACHE_PATH=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[CACHE] NuGet Package Dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-cli-${{ hashFiles('**/*.csproj', '**/*.props', '.nuget/locks/*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-cli-
            ${{ runner.os }}-nuget-

      - name: "[SETUP] Install nFPM Packager"
        run: |
          NFPM_VER="2.41.2"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: "[BUILD] Publish obxodka.Cli (win-x64, linux-x64, linux-arm64)"
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./cli-dist ./stage-win-x64 ./stage-linux-x64 ./stage-linux-arm64

          echo "[CLI] Публикация win-x64..."
          dotnet publish src/apps/obxodka.Cli/obxodka.Cli.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -p:RestoreLockedMode=false \
            -o ./stage-win-x64
          mkdir -p ./stage-win-x64/Engine
          cp src/core/obxodka.Platform.Windows/Engine/wintun.dll ./stage-win-x64/Engine/wintun.dll
          cp LICENSE ./stage-win-x64/LICENSE
          rm -f ./stage-win-x64/packaging/obxodka.service
          rmdir ./stage-win-x64/packaging 2>/dev/null || true
          (cd ./stage-win-x64 && zip -r9 "../cli-dist/obxodka-cli-win-x64.zip" .)

          # генерация multi-file манифестов winget (version + installer + en-US + ru-RU)
          WIN_ZIP_SHA256="$(sha256sum ./cli-dist/obxodka-cli-win-x64.zip | awk '{print toupper($1)}')"
          mkdir -p ./cli-dist/winget-manifests
          for mf in packaging/winget/manifests/*.yaml; do
            PKG_VERSION="$PKG_VERSION" INSTALLER_SHA256="$WIN_ZIP_SHA256" \
              envsubst '${PKG_VERSION} ${INSTALLER_SHA256}' \
              < "$mf" \
              > "./cli-dist/winget-manifests/$(basename "$mf")"
          done

          echo "[CLI] Публикация linux-x64..."
          dotnet publish src/apps/obxodka.Cli/obxodka.Cli.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -p:RestoreLockedMode=false \
            -o ./stage-linux-x64
          rm -rf ./stage-linux-x64/Engine
          chmod +x ./stage-linux-x64/obxodka
          mkdir -p ./stage-linux-x64/completions
          ./stage-linux-x64/obxodka completion bash > ./stage-linux-x64/completions/obxodka.bash
          ./stage-linux-x64/obxodka completion zsh > ./stage-linux-x64/completions/_obxodka
          cp LICENSE ./stage-linux-x64/LICENSE
          tar -czf "./cli-dist/obxodka-cli-linux-x64.tar.gz" -C ./stage-linux-x64 .

          echo "[CLI] Публикация linux-arm64..."
          dotnet publish src/apps/obxodka.Cli/obxodka.Cli.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -p:RestoreLockedMode=false \
            -o ./stage-linux-arm64
          rm -rf ./stage-linux-arm64/Engine
          chmod +x ./stage-linux-arm64/obxodka
          cp -r ./stage-linux-x64/completions ./stage-linux-arm64/completions
          cp LICENSE ./stage-linux-arm64/LICENSE
          tar -czf "./cli-dist/obxodka-cli-linux-arm64.tar.gz" -C ./stage-linux-arm64 .

          echo "[CLI] Сборка нативных пакетов Linux (.deb / .rpm / .pkg.tar.zst)..."
          for pair in "amd64:./stage-linux-x64" "arm64:./stage-linux-arm64"; do
            IFS=':' read -r arch stage <<< "$pair"
            PKG_VERSION="$PKG_VERSION" PKG_ARCH="$arch" STAGE_DIR="$stage" \
              envsubst '${PKG_VERSION} ${PKG_ARCH} ${STAGE_DIR}' \
              < packaging/linux/nfpm-cli.yaml \
              > "/tmp/nfpm-cli-${arch}.yaml"
            nfpm package -f "/tmp/nfpm-cli-${arch}.yaml" -p deb -t ./cli-dist/
            nfpm package -f "/tmp/nfpm-cli-${arch}.yaml" -p rpm -t ./cli-dist/
            nfpm package -f "/tmp/nfpm-cli-${arch}.yaml" -p archlinux -t ./cli-dist/
          done

          ls -lh ./cli-dist/

      - name: "[UPLOAD] Upload CLI Distribution Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: obxodka-cli-dist
          path: ./cli-dist/*
          retention-days: 14

  # ============================================================
  # [STAGE 5C] BUILD LINUX DESKTOP (AVALONIA DEB/RPM/PACMAN/TAR)
  # ============================================================
  build-linux-desktop:
    name: "[BUILD-LINUX-DESKTOP] Avalonia GUI (Linux DEB/RPM/Pacman/Tar)"
    needs: [ check-version, run-tests ]
    runs-on: ubuntu-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform == 'all' || inputs.target_platform == 'linux')
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "[SETUP] Ensure Build Cache Directory"
        run: |
          CACHE_DIR="${RUNNER_TEMP}/build-cache"
          mkdir -p "$CACHE_DIR"
          echo "BUILD_CACHE_PATH=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[CACHE] NuGet Package Dependencies"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-avalonia-${{ hashFiles('**/*.csproj', '**/*.props', '.nuget/locks/*.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-avalonia-
            ${{ runner.os }}-nuget-

      - name: "[SETUP] Install nFPM Packager"
        run: |
          NFPM_VER="2.41.2"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: "[BUILD] Publish obxodka.Avalonia (linux-x64, linux-arm64)"
        env:
          PKG_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./desktop-dist ./stage-desktop-x64 ./stage-desktop-arm64

          for pair in "linux-x64:amd64:stage-desktop-x64" "linux-arm64:arm64:stage-desktop-arm64"; do
            IFS=':' read -r rid arch stage <<< "$pair"
            echo "[DESKTOP] Публикация ${rid}..."
            dotnet publish src/apps/obxodka.Avalonia/obxodka.Avalonia.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:DebugType=None -p:DebugSymbols=false -p:RestoreLockedMode=false \
              -o "./${stage}"
            rm -rf "./${stage}/Engine"
            chmod +x "./${stage}/obxodka.Avalonia"
            tar -czf "./desktop-dist/obxodka-desktop-${rid}.tar.gz" -C "./${stage}" .

            PKG_VERSION="$PKG_VERSION" PKG_ARCH="$arch" STAGE_DIR="./${stage}" \
              envsubst '${PKG_VERSION} ${PKG_ARCH} ${STAGE_DIR}' \
              < packaging/linux/nfpm-desktop.yaml \
              > "/tmp/nfpm-desktop-${arch}.yaml"
            nfpm package -f "/tmp/nfpm-desktop-${arch}.yaml" -p deb -t ./desktop-dist/
            nfpm package -f "/tmp/nfpm-desktop-${arch}.yaml" -p rpm -t ./desktop-dist/
            nfpm package -f "/tmp/nfpm-desktop-${arch}.yaml" -p archlinux -t ./desktop-dist/
          done

          ls -lh ./desktop-dist/

      - name: "[UPLOAD] Upload Linux Desktop Distribution Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: obxodka-linux-desktop-dist
          path: ./desktop-dist/*
          retention-days: 14

  # ============================================================
  # [STAGE 6] AUTOMATED GITHUB RELEASE WITH ASSETS & CHECKSUMS
  # ============================================================
  create-release:
    name: "[RELEASE] GitHub Production Distribution"
    needs: [ check-version, build-android, build-windows, build-cli, build-linux-desktop, deploy-android, deploy-windows ]
    if: |
      always() &&
      (inputs.dry_run != true) &&
      (needs.check-version.outputs.should_release != 'false') &&
      (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-cli.result == 'success' || needs.build-linux-desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "[DOWNLOAD] Download Android Dist Artifacts"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-android-dist
          path: ./release-artifacts/android

      - name: "[DOWNLOAD] Download Windows Dist Artifacts"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-windows-dist
          path: ./release-artifacts/windows

      - name: "[DOWNLOAD] Download CLI Dist Artifacts"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-cli-dist
          path: ./release-artifacts/cli

      - name: "[DOWNLOAD] Download Linux Desktop Dist Artifacts"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-linux-desktop-dist
          path: ./release-artifacts/linux-desktop

      - name: "[BUNDLE] Consolidate Artifacts & SHA256 Checksums"
        id: release-meta
        run: |
          mkdir -p ./release-dist
          find ./release-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.exe" -o -name "*.msix*" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "OctoCore.Obxodka.Cli*.yaml" \) -exec cp {} ./release-dist/ \;

          cd ./release-dist
          sha256sum * > SHA256SUMS.txt
          echo "### [CHECKSUMS] SHA256 Distribution Verification" > release_body.md
          echo '```' >> release_body.md
          cat SHA256SUMS.txt >> release_body.md
          echo '```' >> release_body.md
          echo "" >> release_body.md

          if [ -s ../packaging/whatsnew/whatsnew-ru-RU ]; then
            echo "### [CHANGELOG] Release Notes" >> release_body.md
            cat ../packaging/whatsnew/whatsnew-ru-RU >> release_body.md
            echo "" >> release_body.md
          fi

          python3 ../.github/scripts/update_changelog.py \
            --version "${{ needs.check-version.outputs.version }}" \
            --build "${{ needs.check-version.outputs.build_number }}" \
            --tag "${{ needs.check-version.outputs.tag }}" \
            --stdout-only >> release_body.md || true

          echo "body_file=$(realpath release_body.md)" >> $GITHUB_OUTPUT

      - name: "[RELEASE] Publish GitHub Release & Attach Assets"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.release_title }}
          body_path: ${{ steps.release-meta.outputs.body_file }}
          draft: true
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          files: |
            ./release-dist/*

      - name: "[RELEASE] Finalize Immutable Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --draft=false

  # ============================================================
  # [STAGE 6B] AUTO-PUBLISH WINDOWS CLI TO WINGET
  # ============================================================
  deploy-winget:
    name: "[PUBLISH-WINGET] Windows Package Manager (OctoCore.Obxodka.Cli)"
    needs: [ check-version, build-cli, create-release ]
    runs-on: ubuntu-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (needs.build-cli.result == 'success') &&
      (needs.create-release.result == 'success') &&
      (github.ref_name == 'main' || github.ref_name == 'master' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_stores == true)) &&
      (inputs.dry_run != true)
    outputs:
      deploy_state: ${{ steps.winget-status.outputs.deploy_state }}
    steps:
      - name: "[CHECK] Check WINGET_TOKEN Secret & Existing Package"
        id: winget-check
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::[WINGET] Секрет WINGET_TOKEN не задан — публикация PR в microsoft/winget-pkgs пропущена (см. packaging/winget/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if GH_TOKEN="$WINGET_TOKEN" gh api "repos/microsoft/winget-pkgs/contents/manifests/o/OctoCore/Obxodka/Cli" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::[WINGET] Пакет OctoCore.Obxodka.Cli ещё не принят в microsoft/winget-pkgs. Подайте первый PR один раз через wingetcreate — последующие версии пойдут автоматически."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=pending_first_pr" >> "$GITHUB_OUTPUT"
          fi

      - name: "[PUBLISH] Submit OctoCore.Obxodka.Cli to microsoft/winget-pkgs"
        if: steps.winget-check.outputs.enabled == 'true'
        id: winget-release
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: OctoCore.Obxodka.Cli
          release-tag: ${{ needs.check-version.outputs.tag }}
          installers-regex: 'obxodka-cli-win-x64\.zip$'
          fork-user: irovbyte
          token: ${{ secrets.WINGET_TOKEN }}

      - name: "[TELEMETRY] Winget Deployment Status"
        id: winget-status
        if: always()
        run: |
          if [ "${{ steps.winget-check.outputs.reason }}" = "pending_first_pr" ]; then
            echo "deploy_state=queued" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.winget-check.outputs.enabled }}" != "true" ]; then
            echo "deploy_state=skipped" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.winget-release.outcome }}" = "success" ]; then
            echo "deploy_state=deployed" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_state=failed" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # [STAGE 6C] PUBLISH SIGNED LINUX REPO (APT / DNF / PACMAN ON PAGES)
  # ============================================================
  deploy-linux-repo:
    name: "[PUBLISH-LINUX-REPO] Signed APT / DNF / Pacman Repo (GitHub Pages)"
    needs: [ check-version, build-cli, build-linux-desktop, create-release ]
    runs-on: ubuntu-latest
    if: |
      (needs.check-version.outputs.should_release != 'false') &&
      (needs.build-cli.result == 'success' || needs.build-linux-desktop.result == 'success') &&
      (needs.create-release.result == 'success') &&
      (github.ref_name == 'main' || github.ref_name == 'master' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_stores == true)) &&
      (inputs.dry_run != true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deploy_state: ${{ steps.linux-repo-status.outputs.deploy_state }}
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7

      - name: "[SETUP] Install APT / RPM / GPG Repository Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg

      - name: "[DOWNLOAD] Download Linux CLI & Desktop Packages"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-cli-dist
          path: ./linux-repo-dist/cli

      - name: "[DOWNLOAD] Download Linux Desktop Packages"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: obxodka-linux-desktop-dist
          path: ./linux-repo-dist/desktop

      - name: "[BUILD-REPO] Generate APT, DNF/RPM & Pacman Indexes"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          chmod +x packaging/linux/build-repo.sh
          ./packaging/linux/build-repo.sh \
            ./linux-repo-dist \
            ./pages-site \
            "${{ needs.check-version.outputs.version }}" \
            "https://pkg.obxodka.one"

      - name: "[PAGES] Check GitHub Pages Configuration"
        id: pages-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::[PAGES] GitHub Pages не включён в Settings → Pages (Source: GitHub Actions). Включите Pages для активации APT/DNF/Pacman репозитория."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "[PAGES] Configure GitHub Pages"
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: "[PAGES] Upload Repository Site Artifact"
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

      - name: "[PAGES] Deploy Linux Package Repository"
        if: steps.pages-check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: "[TELEMETRY] Linux Repository Deployment Status"
        id: linux-repo-status
        if: always()
        run: |
          if [ "${{ steps.pages-check.outputs.enabled }}" != "true" ]; then
            echo "deploy_state=skipped" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "deploy_state=deployed" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_state=failed" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # [STAGE 7] EXECUTIVE DASHBOARD & TELEMETRY
  # ============================================================
  telemetry-summary:
    name: "[SUMMARY] Pipeline Telemetry & Status"
    needs: [ check-version, run-tests, build-android, build-windows, build-cli, build-linux-desktop, deploy-android, deploy-windows, create-release, deploy-winget, deploy-linux-repo ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "[SUMMARY] Generate Executive Telemetry Dashboard"
        run: |
          if [ "${{ needs.check-version.outputs.should_release }}" = "false" ]; then
            cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # ℹ️ [PREFLIGHT] Obxodka Release Pipeline Skipped

          > **Notice**: Regular code push detected on branch \`${{ github.ref_name }}\` without a build number increment.
          > Automated store release stages were gracefully skipped.
          > Continuous integration and test verification ran via **CI (Develop Tests & Cross-Platform Validation)**.
          EOF
            exit 0
          fi

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # [TELEMETRY] Obxodka Multi-Store Release Pipeline Dashboard

          | Stage | Identifier | Status | Target Details |
          |---|---|---|---|
          | 0 | `[PREFLIGHT]` | ${{ needs.check-version.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | v${{ needs.check-version.outputs.version }} (Build ${{ needs.check-version.outputs.build_number }}) |
          | 1 | `[TESTS]` | ${{ needs.run-tests.result == 'success' && '`[PASS]`' || '`[FAIL]`' }} | xUnit Client Test Suite |
          | 2 | `[BUILD-ANDROID]` | ${{ needs.build-android.result == 'success' && '`[PASS]`' || (needs.build-android.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`') }} | AAB & APK Bundles |
          | 3 | `[BUILD-WINDOWS]` | ${{ needs.build-windows.result == 'success' && '`[PASS]`' || (needs.build-windows.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`') }} | MSIX & Inno Setup EXE |
          | 4 | `[BUILD-CLI]` | ${{ needs.build-cli.result == 'success' && '`[PASS]`' || (needs.build-cli.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`') }} | Win ZIP + Linux DEB / RPM / Pacman |
          | 5 | `[BUILD-LINUX-DESKTOP]` | ${{ needs.build-linux-desktop.result == 'success' && '`[PASS]`' || (needs.build-linux-desktop.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`') }} | Avalonia GUI Linux DEB / RPM / Pacman |
          | 6 | `[PUBLISH-ANDROID]` | ${{ needs.deploy-android.outputs.deploy_state == 'queued' && '`[QUEUED]`' || (needs.deploy-android.result == 'success' && '`[DEPLOYED]`' || (needs.deploy-android.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`')) }} | Google Play Console (OctoPublisher) |
          | 7 | `[PUBLISH-WINDOWS]` | ${{ needs.deploy-windows.outputs.deploy_state == 'queued' && '`[QUEUED]`' || (needs.deploy-windows.result == 'success' && '`[DEPLOYED]`' || (needs.deploy-windows.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`')) }} | Microsoft Partner Center (OctoPublisher) |
          | 8 | `[RELEASE]` | ${{ needs.create-release.result == 'success' && '`[PUBLISHED]`' || (needs.create-release.result == 'skipped' && '`[SKIP]`' || '`[FAIL]`') }} | GitHub Release ${{ needs.check-version.outputs.tag }} (${{ needs.check-version.outputs.is_prerelease == 'true' && 'Pre-Release' || 'Production' }}) |
          | 9 | `[PUBLISH-WINGET]` | ${{ needs.deploy-winget.outputs.deploy_state == 'deployed' && '`[DEPLOYED]`' || (needs.deploy-winget.outputs.deploy_state == 'queued' && '`[QUEUED]`' || ((needs.deploy-winget.outputs.deploy_state == 'skipped' || needs.deploy-winget.result == 'skipped') && '`[SKIP]`' || '`[FAIL]`')) }} | Winget `OctoCore.Obxodka.Cli` |
          | 10 | `[PUBLISH-LINUX-REPO]` | ${{ needs.deploy-linux-repo.outputs.deploy_state == 'deployed' && '`[DEPLOYED]`' || ((needs.deploy-linux-repo.outputs.deploy_state == 'skipped' || needs.deploy-linux-repo.result == 'skipped') && '`[SKIP]`' || '`[FAIL]`') }} | APT / DNF / Pacman (GitHub Pages) |

          ---
          *Deployment orchestrated automatically by [OctoPublisher](https://www.nuget.org/packages/octopublisher) & GitHub Actions on .NET 11.*
          EOF

      - name: "[CHANGELOG] Update CHANGELOG.md"
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.check-version.outputs.should_release != 'false' && needs.create-release.result == 'success'
        run: |
          python3 .github/scripts/update_changelog.py \
            --version "${{ needs.check-version.outputs.version }}" \
            --build "${{ needs.check-version.outputs.build_number }}" \
            --tag "${{ needs.check-version.outputs.tag }}" \
            --changelog CHANGELOG.md

      - name: "[BADGES] Update Store Deployment Badges"
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.check-version.outputs.should_release != 'false' && (needs.deploy-android.result != 'skipped' || needs.deploy-windows.result != 'skipped' || needs.create-release.result == 'success')
        run: |
          mkdir -p .github/badges
          VERSION="${{ needs.check-version.outputs.version }}"

          ANDROID_STATE="${{ needs.deploy-android.outputs.deploy_state }}"
          if [ "$ANDROID_STATE" = "deployed" ]; then
            cat << JSON > .github/badges/playstore.json
          {
            "schemaVersion": 1,
            "label": "Google Play",
            "message": "Deployed v${VERSION}",
            "color": "00C853"
          }
          JSON
          elif [ "$ANDROID_STATE" = "queued" ]; then
            cat << JSON > .github/badges/playstore.json
          {
            "schemaVersion": 1,
            "label": "Google Play",
            "message": "Queued (In Review)",
            "color": "e3b341"
          }
          JSON
          elif [ "${{ needs.deploy-android.result }}" = "failure" ]; then
            cat << JSON > .github/badges/playstore.json
          {
            "schemaVersion": 1,
            "label": "Google Play",
            "message": "Failed",
            "color": "cb2431"
          }
          JSON
          fi

          WINDOWS_STATE="${{ needs.deploy-windows.outputs.deploy_state }}"
          if [ "$WINDOWS_STATE" = "deployed" ]; then
            cat << JSON > .github/badges/mstore.json
          {
            "schemaVersion": 1,
            "label": "Microsoft Store",
            "message": "Deployed v${VERSION}",
            "color": "0078D4"
          }
          JSON
          elif [ "$WINDOWS_STATE" = "queued" ]; then
            cat << JSON > .github/badges/mstore.json
          {
            "schemaVersion": 1,
            "label": "Microsoft Store",
            "message": "Queued (In Review)",
            "color": "e3b341"
          }
          JSON
          elif [ "${{ needs.deploy-windows.result }}" = "failure" ]; then
            cat << JSON > .github/badges/mstore.json
          {
            "schemaVersion": 1,
            "label": "Microsoft Store",
            "message": "Failed",
            "color": "cb2431"
          }
          JSON
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/ CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(badges): update store deployment status badges and changelog [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
