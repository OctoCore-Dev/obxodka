name: Build & Auto-Deploy (Android Google Play + Microsoft Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия приложения (оставьте пустым для версии из csproj)'
        required: false
        default: ''
      android_track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      publish_to_stores:
        description: 'Отправить в Google Play и Microsoft Store'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 🧪 ЭТАП 1: АВТОМАТИЧЕСКИЕ ТЕСТЫ И ВАЛИДАЦИЯ
  # ==========================================
  run-tests:
    name: 🧪 Automated Unit & Security Tests
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install MAUI Windows Workload for Testing
        run: |
          dotnet workload install maui-windows

      - name: 🚀 Run Client Tests (xUnit)
        run: |
          dotnet test obxodka.Client.Tests/obxodka.Client.Tests.csproj -c Release --logger "console;verbosity=detailed"

  # ==========================================
  # 🤖 ЭТАП 2: СБОРКА И ДЕПЛОЙ ANDROID (ВРЕМЕННО ОТКЛЮЧЕНО)
  # ==========================================
  # build-android:
  #   name: 🤖 Android AAB (Google Play)
  #   needs: [run-tests]
  #   runs-on: ubuntu-latest
  #   ...

  # ==========================================
  # 🪟 ЭТАП 3: СБОРКА И ДЕПЛОЙ WINDOWS (MICROSOFT STORE)
  # ==========================================
  build-windows:
    name: 🪟 Windows MSIX (Microsoft Store)
    needs: [run-tests]
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install .NET MAUI Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: 🚀 Publish Windows Package
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        shell: pwsh
        run: |
          $extraArgs = @()
          if ($env:VERSION_NAME) {
              $extraArgs += "-p:ApplicationDisplayVersion=$env:VERSION_NAME"
              $extraArgs += "-p:Version=$env:VERSION_NAME"
          }

          dotnet publish obxodka.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            $extraArgs

      - name: 🔍 Locate Windows Package
        id: find-windows-pkg
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "bin\Release" -Recurse -File -Include "*.msix", "*.msixupload", "*.appxupload", "*.msixbundle" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkg) {
              $pkg = Get-ChildItem -Recurse -File -Include "*.msix", "*.msixupload", "*.appxupload", "*.msixbundle" | Where-Object { $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          }
          if ($pkg) {
              Write-Host "Found Windows Package: $($pkg.FullName)"
              echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        if: steps.find-windows-pkg.outputs.pkg_path != ''
        with:
          name: obxodka-windows-package
          path: ${{ steps.find-windows-pkg.outputs.pkg_path }}
          retention-days: 14

      - name: 🏬 Auto-Deploy to Microsoft Store
        if: ${{ secrets.STORE_CLIENT_ID != '' && (github.event_name == 'push' || inputs.publish_to_stores == true) }}
        uses: microsoft/store-submission@v1
        with:
          tenant-id: ${{ secrets.STORE_TENANT_ID }}
          client-id: ${{ secrets.STORE_CLIENT_ID }}
          client-secret: ${{ secrets.STORE_CLIENT_SECRET }}
          app-id: ${{ secrets.STORE_APP_ID }}
          package-path: ${{ steps.find-windows-pkg.outputs.pkg_path }}
          delete-pending-submission: true

  # ==========================================
  # 🏷️ ЭТАП 4: АВТОМАТИЧЕСКИЙ РЕЛИЗ НА GITHUB
  # ==========================================
  create-release:
    name: 📦 Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: obxodka-windows-package
          path: ./release-artifacts/windows

      - name: 📝 Extract Release Info
        id: release-info
        run: |
          VERSION=$(grep -oPm1 "(?<=<ApplicationDisplayVersion>)[^<]+" obxodka.csproj || echo "3.7.17")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: Obxodka ${{ steps.release-info.outputs.version }}
          body_path: distribution/whatsnew/whatsnew-ru-RU
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/windows/*
