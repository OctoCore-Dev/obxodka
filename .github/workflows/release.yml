name: Build & Auto-Deploy (Android Google Play + Microsoft Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия приложения (оставьте пустым для версии из csproj)'
        required: false
        default: ''
      android_track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      publish_to_stores:
        description: 'Отправить в Google Play и Microsoft Store'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 🧪 ЭТАП 1: АВТОМАТИЧЕСКИЕ ТЕСТЫ И ВАЛИДАЦИЯ
  # ==========================================
  run-tests:
    name: 🧪 Automated Unit & Security Tests
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install MAUI Windows Workload for Testing
        run: |
          dotnet workload install maui-windows

      - name: 🚀 Run Client Tests (xUnit)
        run: |
          dotnet test obxodka.Client.Tests/obxodka.Client.Tests.csproj -c Release --logger "console;verbosity=detailed"

  # ==========================================
  # 🤖 ЭТАП 2: СБОРКА И ДЕПЛОЙ ANDROID (GOOGLE PLAY)
  # ==========================================
  build-android:
    name: 🤖 Android AAB (Google Play)
    needs: [run-tests]
    runs-on: ubuntu-latest
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: 🔑 Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/keystore/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not found!"
          fi

      - name: 📝 Prepare Release Notes (Commit Message Fallback)
        run: |
          mkdir -p distribution/whatsnew
          if [ ! -s distribution/whatsnew/whatsnew-ru-RU ]; then
            git log -1 --pretty=%B > distribution/whatsnew/whatsnew-ru-RU
          fi
          if [ ! -s distribution/whatsnew/whatsnew-en-US ]; then
            git log -1 --pretty=%B > distribution/whatsnew/whatsnew-en-US
          fi

      - name: 🚀 Publish Android AAB
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'irovbyte' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || '123123' }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS || '123123' }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$VERSION_NAME" ]; then
            EXTRA_ARGS="-p:ApplicationDisplayVersion=$VERSION_NAME -p:Version=$VERSION_NAME"
          fi

          dotnet publish obxodka.csproj -f net10.0-android -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$HOME/keystore/release.keystore" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASS" \
            -p:AndroidSigningStorePass="$STORE_PASS" \
            $EXTRA_ARGS

      - name: 🔍 Locate AAB Package
        id: find-aab
        run: |
          AAB_FILE=$(find bin/Release -type f -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find . -type f -name "*.aab" | grep -v "/obj/" | head -n 1)
          fi
          echo "Found AAB at: $AAB_FILE"
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obxodka-android-aab
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 14

      - name: 📲 Auto-Deploy to Google Play Store
        if: ${{ env.PLAY_CONFIG_JSON != '' && (github.event_name == 'push' || inputs.publish_to_stores == true) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.octocore.obxodka
          releaseFiles: ${{ steps.find-aab.outputs.aab_path }}
          track: ${{ inputs.android_track || 'production' }}
          whatsNewDirectory: distribution/whatsnew
          status: 'completed'

  # ==========================================
  # 🪟 ЭТАП 3: СБОРКА И ДЕПЛОЙ WINDOWS (MICROSOFT STORE)
  # ==========================================
  build-windows:
    name: 🪟 Windows MSIX (Microsoft Store)
    needs: [run-tests]
    runs-on: windows-latest
    env:
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install .NET MAUI Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: 🚀 Publish Windows Package
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        shell: pwsh
        run: |
          $extraArgs = @()
          if ($env:VERSION_NAME) {
              $extraArgs += "-p:ApplicationDisplayVersion=$env:VERSION_NAME"
              $extraArgs += "-p:Version=$env:VERSION_NAME"
          }

          dotnet publish obxodka.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            $extraArgs

      - name: 🔍 Locate Windows Package
        id: find-windows-pkg
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "bin\Release" -Recurse -File -Include "*.msix", "*.msixupload", "*.appxupload", "*.msixbundle" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkg) {
              $pkg = Get-ChildItem -Recurse -File -Include "*.msix", "*.msixupload", "*.appxupload", "*.msixbundle" | Where-Object { $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          }
          if ($pkg) {
              Write-Host "Found Windows Package: $($pkg.FullName)"
              echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        if: steps.find-windows-pkg.outputs.pkg_path != ''
        with:
          name: obxodka-windows-package
          path: ${{ steps.find-windows-pkg.outputs.pkg_path }}
          retention-days: 14

      - name: 🏬 Setup Microsoft Store CLI
        if: ${{ env.STORE_CLIENT_ID != '' && (github.event_name == 'push' || inputs.publish_to_stores == true) }}
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/msstore-cli/releases/download/v0.4.1/MSStoreCLI-win-x64.zip"
          $zip = "$env:TEMP\msstore.zip"
          $dest = "$env:RUNNER_TOOL_CACHE\msstore-cli"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          echo "$dest" >> $env:GITHUB_PATH
          Write-Host "✅ Installed Microsoft Store CLI v0.4.1 to $dest"

      - name: 🚀 Publish to Microsoft Store
        if: ${{ env.STORE_CLIENT_ID != '' && (github.event_name == 'push' || inputs.publish_to_stores == true) }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.STORE_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID || '94042650' }}" `
            --clientId "${{ secrets.STORE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.STORE_CLIENT_SECRET }}"
          
          msstore publish "${{ steps.find-windows-pkg.outputs.pkg_path }}" -id "${{ secrets.STORE_APP_ID || '9NZXP5WR803J' }}"

  # ==========================================
  # 🏷️ ЭТАП 4: АВТОМАТИЧЕСКИЙ РЕЛИЗ НА GITHUB
  # ==========================================
  create-release:
    name: 📦 Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: obxodka-android-aab
          path: ./release-artifacts/android

      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: obxodka-windows-package
          path: ./release-artifacts/windows

      - name: 📝 Extract Release Info
        id: release-info
        run: |
          VERSION=$(grep -oPm1 "(?<=<ApplicationDisplayVersion>)[^<]+" obxodka.csproj || echo "3.7.17")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: Obxodka ${{ steps.release-info.outputs.version }}
          body_path: distribution/whatsnew/whatsnew-ru-RU
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/android/*
            ./release-artifacts/windows/*
