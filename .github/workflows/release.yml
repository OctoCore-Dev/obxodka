name: Build & Auto-Deploy (Android Google Play + Microsoft Store)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Целевая платформа (all = Android + Windows, windows = только Windows, android = только Android)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
      version_name:
        description: 'Версия приложения (оставьте пустым для версии из csproj)'
        required: false
        default: ''
      android_track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      publish_to_stores:
        description: 'Отправить в Google Play и Microsoft Store'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  BUILD_CACHE_PATH: 'C:/BuildCache'

jobs:
  # ==========================================
  # 🧪 ЭТАП 1: АВТОМАТИЧЕСКИЕ ТЕСТЫ И ВАЛИДАЦИЯ
  # ==========================================
  run-tests:
    name: 🧪 Automated Unit & Security Tests
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📁 Ensure Build Cache Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\BuildCache" -Force

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🚀 Run Client Tests (xUnit)
        run: |
          dotnet test tests/obxodka.Client.Tests/obxodka.Client.Tests.csproj -c Release --logger "console;verbosity=detailed"

  # ==========================================
  # 🤖 ЭТАП 2: СБОРКА И АРТЕФАКТ ANDROID (AAB)
  # ==========================================
  build-android:
    name: 🤖 Android AAB Build
    needs: [run-tests]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_platform != 'windows' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: 🔑 Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/keystore/release.keystore
          else
            echo "⚠️ ANDROID_KEYSTORE_BASE64 secret not found!"
          fi

      - name: 📝 Prepare Release Notes (Commit Message Fallback)
        run: |
          mkdir -p packaging/whatsnew
          if [ ! -s packaging/whatsnew/whatsnew-ru-RU ]; then
            git log -1 --pretty=%B > packaging/whatsnew/whatsnew-ru-RU
          fi
          if [ ! -s packaging/whatsnew/whatsnew-en-US ]; then
            git log -1 --pretty=%B > packaging/whatsnew/whatsnew-en-US
          fi

      - name: 🚀 Publish Android AAB
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'irovbyte' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS || '123123' }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS || '123123' }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$VERSION_NAME" ]; then
            EXTRA_ARGS="-p:ApplicationDisplayVersion=$VERSION_NAME -p:Version=$VERSION_NAME"
          fi

          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net10.0-android -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$HOME/keystore/release.keystore" \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$KEY_PASS" \
            -p:AndroidSigningStorePass="$STORE_PASS" \
            $EXTRA_ARGS

      - name: 🔍 Locate AAB Package
        id: find-aab
        run: |
          AAB_FILE=$(find "$HOME/.cache" /home/runner/.cache "$HOME/cache" /home/runner/cache . bin/Release -type f -name "*Signed.aab" 2>/dev/null | grep -v "/obj/" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find "$HOME/.cache" /home/runner/.cache "$HOME/cache" /home/runner/cache . bin/Release -type f -name "*.aab" 2>/dev/null | grep -v "/obj/" | head -n 1)
          fi
          echo "Found AAB at: $AAB_FILE"
          if [ -z "$AAB_FILE" ]; then
            echo "❌ No AAB found!"
            exit 1
          fi
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: 📤 Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obxodka-android-aab
          path: ${{ steps.find-aab.outputs.aab_path }}
          retention-days: 14

  # ==========================================
  # 🪟 ЭТАП 3: СБОРКА И АРТЕФАКТ WINDOWS (MSIX)
  # ==========================================
  build-windows:
    name: 🪟 Windows MSIX Build
    needs: [run-tests]
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_platform != 'android' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 📁 Ensure Build Cache Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\BuildCache" -Force

      - name: 🌐 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Install .NET MAUI Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: 🚀 Publish Windows Package
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        shell: pwsh
        run: |
          $extraArgs = @()
          if ($env:VERSION_NAME) {
              $extraArgs += "-p:ApplicationDisplayVersion=$env:VERSION_NAME"
              $extraArgs += "-p:Version=$env:VERSION_NAME"
          }

          dotnet publish src/apps/obxodka.Maui/obxodka.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:PackageMode=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms="x64" `
            -p:UapAppxPackageBuildMode=StoreUpload `
            $extraArgs

      - name: 🔍 Locate Windows Package
        id: find-windows-pkg
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "src/apps/obxodka.Maui/AppPackages", "AppPackages", "bin\Release", "C:\BuildCache" -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "\\obj\\" -and $_.Name -notmatch "scale-" } | Select-Object -First 1
          if (-not $pkg) {
              $pkg = Get-ChildItem -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" | Where-Object { $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          }
          if ($pkg) {
              Write-Host "Found Windows Package: $($pkg.FullName)"
              echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "Windows package not found!"
              exit 1
          }

      - name: 📤 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obxodka-windows-package
          path: ${{ steps.find-windows-pkg.outputs.pkg_path }}
          retention-days: 14

  # ==========================================
  # 📲 ЭТАП 4: ДЕПЛОЙ ANDROID В GOOGLE PLAY
  # (Запускается ТОЛЬКО если И Android, И Windows успешно собрались!)
  # ==========================================
  deploy-android:
    name: 📲 Deploy to Google Play Store
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.build-android.result == 'success') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform != 'windows') &&
      (github.event_name == 'push' || inputs.publish_to_stores == true)
    env:
      PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Android AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: obxodka-android-aab
          path: ./aab-artifact

      - name: 🔍 Locate AAB Package
        id: find-aab
        run: |
          AAB_FILE=$(find ./aab-artifact -type f -name "*.aab" | head -n 1)
          echo "Found AAB for store deployment: $AAB_FILE"
          if [ -z "$AAB_FILE" ]; then
            echo "❌ No AAB found in downloaded artifact!"
            exit 1
          fi
          echo "aab_path=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: 📲 Upload to Google Play Store
        if: ${{ env.PLAY_CONFIG_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.octocore.obxodka
          releaseFiles: ${{ steps.find-aab.outputs.aab_path }}
          track: ${{ inputs.android_track || 'production' }}
          whatsNewDirectory: packaging/whatsnew
          status: 'completed'

  # ==========================================
  # 🚀 ЭТАП 5: ДЕПЛОЙ WINDOWS В MICROSOFT STORE
  # (Запускается ТОЛЬКО если И Android, И Windows успешно собрались!)
  # ==========================================
  deploy-windows:
    name: 🚀 Deploy to Microsoft Store
    needs: [build-android, build-windows]
    runs-on: windows-latest
    if: |
      always() &&
      (needs.build-windows.result == 'success') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target_platform != 'android') &&
      (github.event_name == 'push' || inputs.publish_to_stores == true)
    env:
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Windows Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: obxodka-windows-package
          path: ./win-artifact

      - name: 🔍 Locate Windows Package
        id: find-windows-pkg
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path "./win-artifact" -Recurse -File -Include "*.msixupload", "*.appxupload", "*.msixbundle", "*.msix" | Select-Object -First 1
          if ($pkg) {
              Write-Host "Found Windows Package for Store deployment: $($pkg.FullName)"
              echo "pkg_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "Windows package not found in downloaded artifact!"
              exit 1
          }

      - name: 🚀 Publish to Microsoft Store
        if: ${{ env.STORE_CLIENT_ID != '' }}
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID || '9NZXP5WR803J' }}
          SELLER_ID: ${{ secrets.SELLER_ID || '94042650' }}
        run: |
          pwsh tools/scripts/publish_msstore.ps1 -PackagePath "${{ steps.find-windows-pkg.outputs.pkg_path }}"

  # ==========================================
  # 🏷️ ЭТАП 6: АВТОМАТИЧЕСКИЙ РЕЛИЗ НА GITHUB
  # ==========================================
  create-release:
    name: 📦 Publish GitHub Release
    needs: [build-android, build-windows, deploy-android, deploy-windows]
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.deploy-android.result == 'success' || needs.deploy-android.result == 'skipped') &&
      (needs.deploy-windows.result == 'success' || needs.deploy-windows.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: obxodka-android-aab
          path: ./release-artifacts/android

      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: obxodka-windows-package
          path: ./release-artifacts/windows

      - name: 📝 Extract Release Info
        id: release-info
        run: |
          VERSION=$(grep -oPm1 "(?<=<AppVersion>)[^<]+" version.props || echo "4.8.6")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: Obxodka ${{ steps.release-info.outputs.version }}
          body_path: packaging/whatsnew/whatsnew-ru-RU
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/android/*
            ./release-artifacts/windows/*
