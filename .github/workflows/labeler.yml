name: PR Auto Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "[LABELS] Classify Pull Request Scope"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
