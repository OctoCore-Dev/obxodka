name: "Security: CodeQL C# Deep Scan"

on:
  push:
    branches: [ develop, main, feat/dotnet11 ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  pull_request:
    branches: [ develop, main, feat/dotnet11 ]
    paths:
      - 'src/**'
      - 'tests/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL Analysis (.NET 11 / Core, Avalonia, Windows MAUI)"
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "[CACHE-DIR] Ensure Build Cache Directory"
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "build-cache"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          "BUILD_CACHE_PATH=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[WORKLOAD] Install MAUI Windows Workload"
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: "[AUDIT] NuGet Dependency Security Vulnerability Audit"
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [SECURITY] SCANNING DEPENDENCIES FOR KNOWN CVE VULNERABILITIES" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          dotnet list package --vulnerable --include-transitive

      - name: "[INIT] Initialize CodeQL Database"
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      - name: "[BUILD] Compile C# Codebase for CodeQL Tracer"
        shell: pwsh
        run: |
          Write-Host "============================================================" -ForegroundColor Cyan
          Write-Host "  [BUILD] COMPILING CORE, TESTS & DESKTOP/WINDOWS UI FOR CODEQL" -ForegroundColor Cyan
          Write-Host "============================================================" -ForegroundColor Cyan
          $projects = @(
            @("src/core/obxodka.Shared/obxodka.Shared.csproj", ""),
            @("src/core/obxodka.Client/obxodka.Client.csproj", ""),
            @("tests/obxodka.Client.Tests/obxodka.Client.Tests.csproj", ""),
            @("src/apps/obxodka.Avalonia/obxodka.Avalonia.csproj", ""),
            @("src/apps/obxodka.Maui/obxodka.Maui.csproj", "net11.0-windows10.0.19041.0")
          )
          foreach ($entry in $projects) {
            $proj = $entry[0]
            $tfm = $entry[1]
            if ($tfm -ne "") {
              dotnet build $proj -f $tfm -c Release -p:BuildWindowsOnly=true
            } else {
              dotnet build $proj -c Release
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: "[ANALYZE] Execute Deep CodeQL Security Inspection"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  analyze-android:
    name: "CodeQL Analysis (.NET 11 / Android MAUI)"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: "[CHECKOUT] Repository Source"
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: "[CACHE-DIR] Ensure Build Cache Directory"
        run: |
          CACHE_DIR="${RUNNER_TEMP}/build-cache"
          mkdir -p "$CACHE_DIR"
          echo "BUILD_CACHE_PATH=$CACHE_DIR" >> "$GITHUB_ENV"

      - name: "[SETUP-JAVA] Setup Java JDK 21"
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: "[SETUP] .NET 11 SDK"
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: "[WORKLOAD] Install MAUI Android Workload"
        run: dotnet workload install maui-android

      - name: "[INIT] Initialize CodeQL Database (Android)"
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      - name: "[BUILD] Compile Android MAUI Client for CodeQL Tracer"
        run: |
          echo "============================================================"
          echo "  [BUILD] COMPILING ANDROID MAUI CLIENT FOR CODEQL"
          echo "============================================================"
          dotnet build src/apps/obxodka.Maui/obxodka.Maui.csproj -f net11.0-android -c Release -p:EnableMauiLinux=true

      - name: "[ANALYZE] Execute Deep CodeQL Security Inspection (Android)"
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp-android"
