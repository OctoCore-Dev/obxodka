<svg width="256" height="256" viewBox="38 40 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Чистый сочный 3D-градиент знака (без дыма и теней) -->
    <linearGradient id="warnYellow3D" x1="128" y1="124" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF966"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА (Чистый вектор, без обводок) -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Левые боковые щупальца -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ЖЁЛТЫЙ ВОСКЛИЦАТЕЛЬНЫЙ ЗНАК (Без обводок, без дыма/тени)  -->
  <!-- ============================================================ -->
  <g>
    <!-- Палочка знака -->
    <path d="M118 132 C118 126 122 122 128 122 C134 122 138 126 138 132 L135 168 C135 172 132 175 128 175 C124 175 121 172 121 168 L118 132 Z" 
          fill="url(#warnYellow3D)"/>

    <!-- Точка знака -->
    <circle cx="128" cy="193" r="10" 
            fill="url(#warnYellow3D)"/>

    <!-- Деликатный блик -->
    <path d="M123 131 L125 163" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="125" cy="190" r="2.5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ЛАПКИ-ШАРИКИ (Без обводок, чистый вектор)                 -->
  <!-- ============================================================ -->
  <!-- Ручки, соединяющие голову с лапками -->
  <g fill="url(#octoGradient)">
    <path d="M106 138 C104 144 107 150 114 153 C117 149 116 143 112 138 Z"/>
    <path d="M150 138 C152 144 149 150 142 153 C139 149 140 143 144 138 Z"/>
  </g>

  <!-- Лапки-шарики с аккуратным бликом -->
  <g>
    <!-- Левый шарик -->
    <circle cx="114" cy="153" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="112" cy="151" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <!-- Правый шарик -->
    <circle cx="142" cy="153" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="140" cy="151" r="2.2" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
