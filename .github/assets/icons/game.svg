<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Градиент корпуса геймпада -->
    <linearGradient id="padGrad" x1="88" y1="150" x2="168" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- 3. Градиент VR-очков геймера -->
    <linearGradient id="vrGrad" x1="88" y1="106" x2="168" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА                               -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Левые боковые щупальца (оригинал Obxodka) -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца (оригинал Obxodka) -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. КИБЕР-ОЧКИ / VR-ВИЗОР ГЕЙМЕРА (Надеты поверх глаз)        -->
  <!-- ============================================================ -->
  <g>
    <!-- Корпус визора -->
    <path d="M88 108 C88 104 96 102 128 102 C160 102 168 104 168 108 L166 124 C166 128 158 130 128 130 C98 130 90 128 90 124 Z" 
          fill="#0B0F19"/>
    
    <!-- Неоновая окантовка и сканирующая полоса -->
    <path d="M90 108 C90 105 97 103 128 103 C159 103 166 105 166 108 L164 123 C164 126 157 128 128 128 C99 128 92 126 92 123 Z" 
          stroke="url(#vrGrad)" 
          stroke-width="1.8" 
          fill="none"/>
    
    <!-- Неоновый HUD интерфейс внутри визора -->
    <line x1="96" y1="116" x2="160" y2="116" stroke="#00FFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="104" cy="116" r="2.8" fill="#00FFFF"/>
    <circle cx="152" cy="116" r="2.8" fill="#FF2E93"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. КИБЕР-ГЕЙМПАД ПО ЦЕНТРУ (Чистый вектор, без обводки/тени)  -->
  <!-- ============================================================ -->
  <g>
    <!-- Корпус геймпада -->
    <path d="M90 150 C76 150 68 162 72 182 C76 198 88 206 99 200 C108 195 114 182 128 182 C142 182 148 195 157 200 C168 206 180 198 184 182 C188 162 180 150 166 150 C149 150 142 156 128 156 C114 156 107 150 90 150 Z" 
          fill="url(#padGrad)"/>

    <!-- Подсветка верхней кромки -->
    <path d="M94 153 C106 153 113 158 128 158 C143 158 150 153 162 153" 
          stroke="#00FFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <!-- D-Pad (Крестовина слева) -->
    <path d="M94 162 H100 V168 H106 V174 H100 V180 H94 V174 H88 V168 H94 V162 Z" 
          fill="#00FFFF"/>

    <!-- Кнопки действий (Справа) -->
    <circle cx="154" cy="171" r="3.2" fill="#FF2E93"/>
    <circle cx="164" cy="171" r="3.2" fill="#00FFFF"/>
    <circle cx="159" cy="165" r="3.2" fill="#FFD700"/>
    <circle cx="159" cy="177" r="3.2" fill="#10B981"/>

    <!-- Стики -->
    <circle cx="112" cy="180" r="6" fill="#1E293B"/>
    <circle cx="144" cy="180" r="6" fill="#1E293B"/>
    <circle cx="112" cy="180" r="2.5" fill="#00FFFF"/>
    <circle cx="144" cy="180" r="2.5" fill="#FF2E93"/>

    <!-- LED-индикатор по центру -->
    <rect x="123" y="163" width="10" height="3" rx="1.5" fill="#00FFFF"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. ЛАПКИ-ШАРИКИ (Держат геймпад по бокам)                   -->
  <!-- ============================================================ -->
  <!-- Ручки, соединяющие тело с лапками -->
  <g fill="url(#octoGradient)">
    <path d="M100 142 C94 150 88 160 84 170 C89 168 96 156 104 146 Z"/>
    <path d="M156 142 C162 150 168 160 172 170 C167 168 160 156 152 146 Z"/>
  </g>

  <!-- Лапки-шарики с бликами -->
  <g>
    <!-- Левый шарик -->
    <circle cx="84" cy="172" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="82" cy="170" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <!-- Правый шарик -->
    <circle cx="172" cy="172" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="170" cy="170" r="2.2" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
