<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Градиент кибер-щита Smart Shield -->
    <linearGradient id="shieldCyan3D" x1="128" y1="136" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60CDFF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА (Чистый вектор, без обводок) -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Левые боковые щупальца -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. КИБЕР-ЩИТ SMART SHIELD ПО ЦЕНТРУ (Без тени/обводки тела)   -->
  <!-- ============================================================ -->
  <g>
    <!-- Форма щита -->
    <path d="M128 138 L156 148 C156 177 142 198 128 208 C114 198 100 177 100 148 Z" 
          fill="url(#shieldCyan3D)"/>
    <!-- Внутренний неоновый обод -->
    <path d="M128 144 L150 152 C150 173 139 191 128 199 C117 191 106 173 106 152 Z" 
          fill="none" 
          stroke="#E0F2FE" 
          stroke-width="1.8" 
          opacity="0.75"/>
    
    <!-- Неоновый герб защиты (Эмблема безопасности) -->
    <path d="M128 156 L134 168 L146 170 L137 178 L139 190 L128 184 L117 190 L119 178 L110 170 L122 168 Z" 
          fill="#FFFFFF" 
          opacity="0.9"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ЛАПКИ-ШАРИКИ (Держат щит по бокам)                       -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <path d="M106 138 C102 146 100 156 98 168 C103 166 108 154 114 144 Z"/>
    <path d="M150 138 C154 146 156 156 158 168 C153 166 148 154 142 144 Z"/>
  </g>

  <g>
    <!-- Левый шарик -->
    <circle cx="98" cy="168" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="96" cy="166" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <!-- Правый шарик -->
    <circle cx="158" cy="168" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="156" cy="166" r="2.2" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
