    <circle cx="128" cy="176" r="16" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="128" cy="176" r="8" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
