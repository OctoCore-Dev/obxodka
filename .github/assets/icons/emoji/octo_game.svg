<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Authentic Obxodka Brand Gradient -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- Gamepad Gradient -->
    <linearGradient id="padGrad" x1="88" y1="150" x2="168" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="mimiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00FFFF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. "МИ-МИ" ЗАДНИЕ И БОКОВЫЕ НОЖКИ (Curled, Bouncy, Chibi)    -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Боковая левая ножка (весело закручена вверх, как лапка в восторге) -->
    <path d="M78 122 C56 124 40 136 38 152 C36 166 48 174 58 168 C68 162 66 148 76 138 Z"/>
    
    <!-- Боковая правая ножка (весело закручена вверх) -->
    <path d="M178 122 C200 124 216 136 218 152 C220 166 208 174 198 168 C188 162 190 148 180 138 Z"/>

    <!-- Нижние ножки (пухлые чиби-колечки снизу, будто сидит и качает лапками) -->
    <!-- Левая нижняя ножка с круглым завиточком -->
    <path d="M110 142 C104 162 96 182 102 198 C106 208 118 208 122 198 C126 188 116 180 114 172 C116 162 120 152 124 142 Z"/>
    
    <!-- Правая нижняя ножка с круглым завиточком -->
    <path d="M146 142 C152 162 160 182 154 198 C150 208 138 208 134 198 C130 188 140 180 142 172 C140 162 136 152 132 142 Z"/>

    <!-- Дополнительные игривые внешние завитки снизу -->
    <path d="M88 140 C76 150 64 164 68 180 C72 192 86 192 90 182 C94 172 86 162 92 148 Z"/>
    <path d="M168 140 C180 150 192 164 188 180 C184 192 170 192 166 182 C162 172 170 162 164 148 Z"/>
  </g>

  <!-- Маленькие неоновые присоски на завитках (придают супер-милоту) -->
  <g fill="#00FFFF" opacity="0.85">
    <!-- Присоски на левой лапке -->
    <circle cx="44" cy="148" r="3.2"/>
    <circle cx="50" cy="162" r="2.8"/>
    <circle cx="62" cy="170" r="2.2"/>
    <!-- Присоски на правой лапке -->
    <circle cx="212" cy="148" r="3.2"/>
    <circle cx="206" cy="162" r="2.8"/>
    <circle cx="194" cy="170" r="2.2"/>
    <!-- Присоски на нижних ножках -->
    <circle cx="106" cy="192" r="2.8" fill="#FF2E93"/>
    <circle cx="150" cy="192" r="2.8" fill="#FF2E93"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ГОЛОВА И ГЛАЗА (100% Аутентичная голова Obxodka)          -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>
    
    <!-- Аутентичные глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ГЕЙМПАД (Который он держит передними щупальцами)          -->
  <!-- ============================================================ -->
  <g filter="url(#mimiGlow)">
    <!-- Корпус геймпада -->
    <path d="M90 150 C76 150 68 162 72 182 C76 198 88 206 99 200 C108 195 114 182 128 182 C142 182 148 195 157 200 C168 206 180 198 184 182 C188 162 180 150 166 150 C149 150 142 156 128 156 C114 156 107 150 90 150 Z" 
          fill="url(#padGrad)" 
          stroke="#0B0F19" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Подсветка верхней кромки -->
    <path d="M94 153 C106 153 113 158 128 158 C143 158 150 153 162 153" 
          stroke="#00FFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.8"/>

    <!-- D-Pad (Крестовина слева) -->
    <path d="M94 162 H100 V168 H106 V174 H100 V180 H94 V174 H88 V168 H94 V162 Z" 
          fill="#00FFFF" 
          stroke="#0B0F19" 
          stroke-width="1.5"/>

    <!-- Кнопки действий (Справа) -->
    <circle cx="154" cy="171" r="3.2" fill="#FF2E93" stroke="#0B0F19" stroke-width="1.2"/>
    <circle cx="164" cy="171" r="3.2" fill="#00FFFF" stroke="#0B0F19" stroke-width="1.2"/>
    <circle cx="159" cy="165" r="3.2" fill="#FFD700" stroke="#0B0F19" stroke-width="1.2"/>
    <circle cx="159" cy="177" r="3.2" fill="#10B981" stroke="#0B0F19" stroke-width="1.2"/>

    <!-- Стики -->
    <circle cx="112" cy="180" r="6" fill="#1E293B" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="144" cy="180" r="6" fill="#1E293B" stroke="#0B0F19" stroke-width="2"/>
    <circle cx="112" cy="180" r="2.5" fill="#00FFFF"/>
    <circle cx="144" cy="180" r="2.5" fill="#FF2E93"/>

    <!-- LED-индикатор по центру -->
    <rect x="123" y="163" width="10" height="3" rx="1.5" fill="#00FFFF"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. ПЕРЕДНИЕ ЩУПАЛЬЦА: Аккуратный, естественный хват          -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Левое щупальце обнимает геймпад -->
    <path d="M70 176 C65 185 72 195 81 192 C86 190 87 183 80 177 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
    <!-- Правое щупальце обнимает геймпад -->
    <path d="M186 176 C191 185 184 195 175 192 C170 190 169 183 176 177 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
  </g>
</svg>
