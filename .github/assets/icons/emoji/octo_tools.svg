<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Градиент отвёртки -->
    <linearGradient id="toolAmberGrad" x1="110" y1="150" x2="150" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА (Чистый вектор, без обводок) -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Левые боковые щупальца -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. СКРЕЩЕННЫЕ КИБЕР-ИНСТРУМЕНТЫ (Без тени/обводки тела)      -->
  <!-- ============================================================ -->
  <g>
    <!-- Гаечный ключ (Циан) -->
    <path d="M110 150 L146 194" stroke="#00FFFF" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M106 146 C102 150 104 158 110 160 L115 155 C113 153 113 151 115 149 Z" fill="#00FFFF"/>
    <circle cx="146" cy="194" r="4.5" fill="#00FFFF"/>

    <!-- Отвёртка (Янтарь/Золото) -->
    <path d="M146 150 L110 194" stroke="url(#toolAmberGrad)" stroke-width="5" stroke-linecap="round"/>
    <rect x="136" y="146" width="7" height="13" rx="2.5" transform="rotate(-40 140 152)" fill="url(#toolAmberGrad)"/>
    <line x1="112" y1="192" x2="108" y2="196" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Центральный соединительный болт -->
    <circle cx="128" cy="172" r="5" fill="#0F172A"/>
    <circle cx="128" cy="172" r="2.5" fill="#00FFFF"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ЛАПКИ-ШАРИКИ (Держат инструменты по бокам)               -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <path d="M106 138 C102 146 100 156 98 168 C103 166 108 154 114 144 Z"/>
    <path d="M150 138 C154 146 156 156 158 168 C153 166 148 154 142 144 Z"/>
  </g>

  <g>
    <!-- Левый шарик -->
    <circle cx="98" cy="170" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="96" cy="168" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <!-- Правый шарик -->
    <circle cx="158" cy="170" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="156" cy="168" r="2.2" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
