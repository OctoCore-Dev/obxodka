    <filter id="plugGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#A855F7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Octopus Body & Tentacles -->
  <g fill="url(#octoGradient)">
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>
    
    <ellipse cx="102" cy="118" rx="8" ry="7" fill="#0F172A" opacity="0.85"/>
    <ellipse cx="154" cy="118" rx="8" ry="7" fill="#0F172A" opacity="0.85"/>
    <circle cx="104" cy="116" r="2.5" fill="#FFFFFF"/>
    <circle cx="156" cy="116" r="2.5" fill="#FFFFFF"/>

    <path d="M116 140 C110 160 105 185 112 205 C115 212 124 212 126 205 C128 195 124 175 128 155 C132 175 128 195 130 205 C132 212 141 212 144 205 C151 185 146 160 140 140 Z"/>
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- Disconnected Power/Network Plugs (Zero-Flicker Disconnect) -->
  <g filter="url(#plugGlow)">
    <!-- Left Plug -->
    <rect x="96" y="168" width="16" height="18" rx="4" fill="#0F172A" stroke="#00FFFF" stroke-width="2"/>
    <rect x="112" y="171" width="6" height="3" fill="#00FFFF"/>
    <rect x="112" y="180" width="6" height="3" fill="#00FFFF"/>

    <!-- Right Socket -->
    <rect x="144" y="168" width="16" height="18" rx="4" fill="#0F172A" stroke="#FF2E93" stroke-width="2"/>
    <rect x="138" y="171" width="6" height="3" fill="#FF2E93"/>
    <rect x="138" y="180" width="6" height="3" fill="#FF2E93"/>

    <!-- Small Spark Between Plugs -->
    <path d="M128 165 L129 173 L126 175 L130 183 L128 178 L131 176 Z" fill="#FACC15"/>
  </g>

  <!-- Front Gripping Tentacles -->
  <g fill="url(#octoGradient)">
    <path d="M92 174 C88 179 92 186 98 184 C102 183 103 178 99 174 Z"/>
    <path d="M164 174 C168 179 164 186 158 184 C154 183 153 178 157 174 Z"/>
