<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka (100% оригинальный) -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Сочный 3D-градиент знака -->
    <linearGradient id="warnYellow3D" x1="128" y1="130" x2="128" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF966"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- 3. Неоновое свечение знака -->
    <filter id="warnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ОРИГИНАЛЬНАЯ ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА (из appiconfg)   -->
  <!-- Центральные 2 свисающих щупальца УБРАНЫ по задумке           -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота (100% оригинал) -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Глазки (100% оригинал, тёмный кибер-нейви для контраста) -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Левые боковые щупальца (100% оригинальные резкие линии Obxodka) -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца (100% оригинальные резкие линии Obxodka) -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ВМЕСТО ДВУХ ЦЕНТРАЛЬНЫХ ЩУПАЛЕЦ: Жёлтый Знак Предупреждения-->
  <!-- ============================================================ -->
  <g filter="url(#warnGlow)">
    <!-- Палочка знака (крупная, читаемая, контрастная) -->
    <path d="M118 134 C118 128 122 124 128 124 C134 124 138 128 138 134 L135 169 C135 173 132 176 128 176 C124 176 121 173 121 169 L118 134 Z" 
          fill="url(#warnYellow3D)" 
          stroke="#0B0F19" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Точка знака -->
    <circle cx="128" cy="194" r="10" 
            fill="url(#warnYellow3D)" 
            stroke="#0B0F19" 
            stroke-width="4.5"/>

    <!-- Блик на знаке -->
    <path d="M123 133 L125 164" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="125" cy="191" r="2.8" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ДВЕ ЛАПКИ, КОТОРЫЕ ДЕРЖАТ ЗНАК (в фирменном стиле)        -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Левая лапка: выходит из-под головы и обхватывает палочку знака -->
    <path d="M106 140 C104 150 110 162 123 162 C127 162 127 156 121 154 C115 152 110 147 106 140 Z" 
          stroke="#0B0F19" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- Правая лапка: выходит из-под головы и придерживает точку знака -->
    <path d="M150 140 C154 156 146 182 135 186 C131 187 129 181 135 177 C142 171 146 156 150 140 Z" 
          stroke="#0B0F19" 
          stroke-width="2" 
          stroke-linejoin="round"/>
  </g>
</svg>
