<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Authentic Obxodka Brand Gradient -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 3D Yellow Warning Gradient -->
    <linearGradient id="warnYellow3D" x1="128" y1="125" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF966"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Ambient Yellow Glow Filter -->
    <filter id="warnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. "МИ-МИ" ЗАДНИЕ И БОКОВЫЕ НОЖКИ (Утвержденная анатомия)     -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Боковая левая ножка (весело закручена вверх) -->
    <path d="M78 122 C56 124 40 136 38 152 C36 166 48 174 58 168 C68 162 66 148 76 138 Z"/>
    
    <!-- Боковая правая ножка (весело закручена вверх) -->
    <path d="M178 122 C200 124 216 136 218 152 C220 166 208 174 198 168 C188 162 190 148 180 138 Z"/>

    <!-- Нижние ножки (пухлые чиби-колечки снизу, поза сидя) -->
    <path d="M110 142 C104 162 96 182 102 198 C106 208 118 208 122 198 C126 188 116 180 114 172 C116 162 120 152 124 142 Z"/>
    <path d="M146 142 C152 162 160 182 154 198 C150 208 138 208 134 198 C130 188 140 180 142 172 C140 162 136 152 132 142 Z"/>

    <!-- Внешние нижние завитки -->
    <path d="M88 140 C76 150 64 164 68 180 C72 192 86 192 90 182 C94 172 86 162 92 148 Z"/>
    <path d="M168 140 C180 150 192 164 188 180 C184 192 170 192 166 182 C162 172 170 162 164 148 Z"/>
  </g>

  <!-- Маленькие неоновые присоски на завитках лапок -->
  <g fill="#00FFFF" opacity="0.85">
    <circle cx="44" cy="148" r="3.2"/>
    <circle cx="50" cy="162" r="2.8"/>
    <circle cx="62" cy="170" r="2.2"/>
    <circle cx="212" cy="148" r="3.2"/>
    <circle cx="206" cy="162" r="2.8"/>
    <circle cx="194" cy="170" r="2.2"/>
    <circle cx="106" cy="192" r="2.8" fill="#FF2E93"/>
    <circle cx="150" cy="192" r="2.8" fill="#FF2E93"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ГОЛОВА И ГЛАЗА (100% Аутентичная геометрия Obxodka)        -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>
    
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ДЕЙСТВИЕ: Крупный 3D Жёлтый Восклицательный Знак          -->
  <!-- ============================================================ -->
  <g filter="url(#warnGlow)">
    <!-- Палочка знака -->
    <path d="M117 136 C117 130 121 126 128 126 C135 126 139 130 139 136 L135 171 C135 175 132 178 128 178 C124 178 121 175 121 171 L117 136 Z" 
          fill="url(#warnYellow3D)" 
          stroke="#0B0F19" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Точка знака -->
    <circle cx="128" cy="195" r="10.5" 
            fill="url(#warnYellow3D)" 
            stroke="#0B0F19" 
            stroke-width="4.5"/>

    <!-- Световые блики -->
    <path d="M122 135 L124 166" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.85"/>
    <circle cx="125" cy="192" r="3" 
            fill="#FFFFFF" 
            opacity="0.85"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. ПЕРЕДНИЕ ЩУПАЛЬЦА: Естественный хват знака               -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Левое щупальце обнимает палочку -->
    <path d="M113 166 C110 173 115 180 123 178 C127 176 128 170 122 165 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
    <!-- Правое щупальце придерживает точку -->
    <path d="M142 188 C144 195 139 201 132 199 C128 197 128 191 133 187 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
  </g>
</svg>
