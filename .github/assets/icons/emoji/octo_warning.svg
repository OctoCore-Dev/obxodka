<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Authentic Obxodka Brand Gradient (exact from MAUI appiconfg.svg) -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Rich 3D Yellow Warning Gradient -->
    <linearGradient id="warnYellow3D" x1="128" y1="125" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF966"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- 3. Vibrant Ambient Glow Filter for Exclamation Mark -->
    <filter id="yellowEmojiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- BASE OCTOPUS: 100% Authentic Geometry from MAUI appiconfg.svg -->
  <!-- NO SHIELD! Pure Transparent Background                       -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Head / Mantle -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>
    
    <!-- Authentic Eyes (Exact appiconfg.svg coordinates, solid navy for high contrast) -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Authentic Tentacles -->
    <path d="M116 140 C110 160 105 185 112 205 C115 212 124 212 126 205 C128 195 124 175 128 155 C132 175 128 195 130 205 C132 212 141 212 144 205 C151 185 146 160 140 140 Z"/>
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- ACTION: Chunky, Bold 3D Yellow Exclamation Mark held in front -->
  <!-- Optimized for high visibility at 20-32px emoji sizes         -->
  <!-- ============================================================ -->
  <g filter="url(#yellowEmojiGlow)">
    <!-- 1. Exclamation Bar (Chunky, tapered, bold outline) -->
    <path d="M117 136 C117 130 121 126 128 126 C135 126 139 130 139 136 L135 171 C135 175 132 178 128 178 C124 178 121 175 121 171 L117 136 Z" 
          fill="url(#warnYellow3D)" 
          stroke="#0B0F19" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- 2. Exclamation Dot (Chunky circular dot) -->
    <circle cx="128" cy="195" r="10.5" 
            fill="url(#warnYellow3D)" 
            stroke="#0B0F19" 
            stroke-width="4.5"/>

    <!-- 3. Specular Gloss Highlights for 3D Emoji Look -->
    <path d="M122 135 L124 166" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.85"/>
    <circle cx="125" cy="192" r="3" 
            fill="#FFFFFF" 
            opacity="0.85"/>
  </g>

  <!-- ============================================================ -->
  <!-- NATURAL GRIP: Tentacle tips curling over the Mark            -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Left Tentacle Grip over the lower bar -->
    <path d="M113 166 C110 173 115 180 123 178 C127 176 128 170 122 165 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
    <!-- Right Tentacle Grip near the dot -->
    <path d="M142 188 C144 195 139 201 132 199 C128 197 128 191 133 187 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
  </g>
</svg>
