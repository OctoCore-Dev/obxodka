<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Authentic Obxodka Brand Gradient -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 3D Yellow Warning Gradient -->
    <linearGradient id="warnYellow3D" x1="128" y1="125" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF966"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="warnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И РОВНО 4 НОЖКИ (2 сбоку + 2 лапки снизу)          -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Аутентичные глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- [Ножка 1] Боковая левая: аккуратный завиток кверху -->
    <path d="M78 126 C58 128 44 140 42 155 C40 168 52 176 62 170 C72 164 72 150 82 140 Z"/>

    <!-- [Ножка 2] Боковая правая: аккуратный завиток кверху -->
    <path d="M178 126 C198 128 212 140 214 155 C216 168 204 176 194 170 C184 164 184 150 174 140 Z"/>

    <!-- [Ножка 3] Нижняя левая лапка (сидит на ней) -->
    <path d="M104 142 C96 160 88 178 94 194 C98 204 112 204 116 194 C120 184 110 174 114 160 C116 152 118 146 120 142 Z"/>

    <!-- [Ножка 4] Нижняя правая лапка (сидит на ней) -->
    <path d="M152 142 C160 160 168 178 162 194 C158 204 144 204 140 194 C136 184 146 174 142 160 C140 152 138 146 136 142 Z"/>
  </g>

  <!-- Аккуратные неоновые присоски на 4 ножках -->
  <g fill="#00FFFF" opacity="0.85">
    <!-- Левая боковая ножка -->
    <circle cx="48" cy="152" r="3"/>
    <circle cx="56" cy="164" r="2.5"/>
    <!-- Правая боковая ножка -->
    <circle cx="208" cy="152" r="3"/>
    <circle cx="200" cy="164" r="2.5"/>
    <!-- Нижние лапки -->
    <circle cx="98" cy="190" r="2.8" fill="#FF2E93"/>
    <circle cx="158" cy="190" r="2.8" fill="#FF2E93"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ДЕЙСТВИЕ: Крупный 3D Жёлтый Восклицательный Знак          -->
  <!-- ============================================================ -->
  <g filter="url(#warnGlow)">
    <!-- Палочка знака -->
    <path d="M117 136 C117 130 121 126 128 126 C135 126 139 130 139 136 L135 171 C135 175 132 178 128 178 C124 178 121 175 121 171 L117 136 Z" 
          fill="url(#warnYellow3D)" 
          stroke="#0B0F19" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>

    <!-- Точка знака -->
    <circle cx="128" cy="195" r="10.5" 
            fill="url(#warnYellow3D)" 
            stroke="#0B0F19" 
            stroke-width="4.5"/>

    <!-- Световые блики -->
    <path d="M122 135 L124 166" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.85"/>
    <circle cx="125" cy="192" r="3" 
            fill="#FFFFFF" 
            opacity="0.85"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. [Ножки 5 и 6]: Ровно 2 передние ручки, держащие знак      -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- [Ножка 5] Левая ручка обнимает палочку -->
    <path d="M96 148 C94 158 106 172 120 170 C125 169 125 163 118 160 C110 156 102 152 96 148 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
    <!-- [Ножка 6] Правая ручка придерживает точку -->
    <path d="M160 156 C162 170 148 190 136 190 C131 190 130 184 137 180 C146 175 154 166 160 156 Z" 
          stroke="#0B0F19" 
          stroke-width="2"/>
  </g>
</svg>
