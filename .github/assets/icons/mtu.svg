<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. Фирменный градиент Obxodka -->
    <linearGradient id="octoGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <!-- 2. Градиент панели MTU -->
    <linearGradient id="mtuDarkGrad" x1="128" y1="156" x2="128" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- 3. Градиент безопасной шкалы MTU -->
    <linearGradient id="mtuCyanGrad" x1="102" y1="169" x2="138" y2="169" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- ============================================================ -->
  <!-- 1. ГОЛОВА И 4 БОКОВЫХ ЩУПАЛЬЦА (Чистый вектор, без обводок) -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <!-- Голова маскота -->
    <path d="M128 55 C95 55 75 75 75 105 C75 125 88 138 100 142 C108 145 115 138 128 138 C141 138 148 145 156 142 C168 138 181 125 181 105 C181 75 161 55 128 55 Z"/>

    <!-- Глазки -->
    <path d="M102 112 C98 112 95 115 95 118 C95 121 98 124 102 124 C106 124 109 121 109 118 C109 115 106 112 102 112 Z" fill="#0B0F19"/>
    <path d="M154 112 C150 112 147 115 147 118 C147 121 150 124 154 124 C158 124 161 121 161 118 C161 115 158 112 154 112 Z" fill="#0B0F19"/>

    <!-- Левые боковые щупальца -->
    <path d="M92 136 C80 145 60 155 52 172 C46 185 54 198 66 194 C76 190 82 175 92 165 C96 161 100 148 95 142 Z"/>
    <path d="M80 118 C62 122 45 132 40 148 C36 162 46 172 56 166 C66 160 72 146 84 136 Z"/>

    <!-- Правые боковые щупальца -->
    <path d="M164 136 C176 145 196 155 204 172 C210 185 202 198 190 194 C180 190 174 175 164 165 C160 161 156 148 161 142 Z"/>
    <path d="M176 118 C194 122 211 132 216 148 C220 162 210 172 200 166 C190 160 184 146 172 136 Z"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. ПАНЕЛЬ MTU 1280 (Фрейминг пакетов, без тени/обводки тела)  -->
  <!-- ============================================================ -->
  <g>
    <!-- Корпус шкалы -->
    <rect x="92" y="156" width="72" height="34" rx="8" fill="url(#mtuDarkGrad)"/>
    <path d="M98 158 H158" stroke="#00FFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Трек слайдера -->
    <rect x="102" y="165" width="52" height="6" rx="3" fill="#1E293B"/>
    <!-- Безопасная зона пакета 1280 байт -->
    <rect x="102" y="165" width="36" height="6" rx="3" fill="url(#mtuCyanGrad)"/>
    <!-- Бегунок слайдера -->
    <circle cx="138" cy="168" r="5.5" fill="#00FFFF"/>
    <circle cx="138" cy="168" r="2.2" fill="#FFFFFF"/>

    <!-- Цифровая надпись 1280 MTU -->
    <text x="128" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" fill="#00FFFF" letter-spacing="1">1280</text>
  </g>

  <!-- ============================================================ -->
  <!-- 3. ЛАПКИ-ШАРИКИ (Держат панель по бокам)                     -->
  <!-- ============================================================ -->
  <g fill="url(#octoGradient)">
    <path d="M100 142 C94 150 90 160 88 171 C93 169 98 156 104 146 Z"/>
    <path d="M156 142 C162 150 166 160 168 171 C163 169 158 156 152 146 Z"/>
  </g>

  <g>
    <!-- Левый шарик -->
    <circle cx="90" cy="173" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="88" cy="171" r="2.2" fill="#FFFFFF" opacity="0.75"/>

    <!-- Правый шарик -->
    <circle cx="166" cy="173" r="8.5" fill="url(#octoGradient)"/>
    <circle cx="164" cy="171" r="2.2" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
