<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00e5ff;#8b5cf6;#ff007f;#00ff88;#00e5ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#8b5cf6;#ff007f;#00ff88;#00e5ff;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#ff007f;#00ff88;#00e5ff;#8b5cf6;#ff007f" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 10px rgba(0,229,255,0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(168,85,247,0.7)); }
    }
    @keyframes typingEffect {
      0%, 20% { opacity: 1; content: "⚡ Next-Gen Stealth Tunneling • 100% DPI Resistant"; }
      25%, 45% { opacity: 1; content: "🛡️ Powered by Octopus Engine (gRPC HTTP/2 + mTLS)"; }
      50%, 70% { opacity: 1; content: "⚡ Ultra-Fast Wintun Layer 3 Driver & Android VpnService"; }
      75%, 95% { opacity: 1; content: "🔒 Zero-Log Architecture • Absolute Privacy & Speed"; }
      100% { opacity: 1; content: "⚡ Next-Gen Stealth Tunneling • 100% DPI Resistant"; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .card-box {
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .cursor {
      animation: cursorBlink 0.8s infinite;
    }
  </style>

  <!-- Background Panel -->
  <rect x="5" y="5" width="890" height="120" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" class="card-box" />

  <!-- Badge Top -->
  <rect x="25" y="20" width="140" height="24" rx="12" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1" />
  <circle cx="37" cy="32" r="4" fill="#00ff88">
    <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="48" y="36" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LIVE CORE ENGINE</text>

  <!-- Title -->
  <text x="25" y="72" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5" filter="url(#glow)">
    OCTOPUS STEALTH TUNNEL
  </text>

  <!-- Dynamic Typing Subtitle using SVG Switch/Animation -->
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" font-weight="500">
    <!-- Message 1 -->
    <text x="25" y="100" fill="#94a3b8">
      <tspan fill="#38bdf8">&gt;</tspan> 
      <tspan fill="#f1f5f9">
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" dur="16s" repeatCount="indefinite" />
        ⚡ Next-Gen Stealth Tunneling • 100% DPI Resistant
      </tspan>
      <tspan fill="#f1f5f9">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" dur="16s" repeatCount="indefinite" />
        🛡️ Powered by Octopus Engine (gRPC HTTP/2 + mTLS)
      </tspan>
      <tspan fill="#f1f5f9">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="16s" repeatCount="indefinite" />
        ⚡ Ultra-Fast Wintun Layer 3 Driver &amp; Android VpnService
      </tspan>
      <tspan fill="#f1f5f9">
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="16s" repeatCount="indefinite" />
        🔒 Zero-Log Architecture • Absolute Privacy &amp; Speed
      </tspan>
      <tspan fill="#00e5ff" class="cursor">_</tspan>
    </text>
  </g>

  <!-- Right Side Animated Equalizer Bars -->
  <g transform="translate(800, 45)">
    <rect x="0" y="0" width="5" height="40" rx="2" fill="#00e5ff">
      <animate attributeName="height" values="10;38;15;30;10" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;2;25;10;30" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="0" width="5" height="40" rx="2" fill="#8b5cf6">
      <animate attributeName="height" values="25;10;38;18;25" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="15;30;2;22;15" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="0" width="5" height="40" rx="2" fill="#ff007f">
      <animate attributeName="height" values="35;20;10;38;35" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="5;20;30;2;5" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="0" width="5" height="40" rx="2" fill="#00ff88">
      <animate attributeName="height" values="15;35;22;8;15" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="25;5;18;32;25" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="0" width="5" height="40" rx="2" fill="#38bdf8">
      <animate attributeName="height" values="30;12;35;20;30" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;28;5;20;10" dur="1.3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
