<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <style>
    @keyframes ringPulse {
      0% { r: 6px; opacity: 1; }
      100% { r: 22px; opacity: 0; }
    }
    .ring-anim {
      animation: ringPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Фоновая панель телеметрии -->
  <rect x="5" y="5" width="890" height="170" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Верхняя строка заголовка -->
  <text x="25" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
    REAL-TIME TELEMETRY AND PERFORMANCE BENCHMARKS (OBXODKA-STREAM)
  </text>

  <!-- Метрика 1: Обход DPI / ТСПУ -->
  <g transform="translate(25, 50)">
    <rect width="195" height="105" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
    <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">DPI / TSPU BYPASS</text>
    <text x="15" y="65" fill="#00ff88" font-family="sans-serif" font-size="28" font-weight="900">100%</text>
    <text x="15" y="88" fill="#38bdf8" font-family="sans-serif" font-size="11">OBXODKA-STREAM Duplex</text>
    <circle cx="170" cy="25" r="5" fill="#00ff88" />
    <circle cx="170" cy="25" r="6" fill="none" stroke="#00ff88" stroke-width="1.5" class="ring-anim" />
  </g>

  <!-- Метрика 2: Игровой пинг и задержка (Dual-Ray) -->
  <g transform="translate(240, 50)">
    <rect width="195" height="105" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
    <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">LATENCY (DUAL-RAY)</text>
    <text x="15" y="65" fill="#00e5ff" font-family="sans-serif" font-size="28" font-weight="900">&lt; 0.8ms</text>
    <text x="15" y="88" fill="#a855f7" font-family="sans-serif" font-size="11">Dual-Ray Packet Hedging</text>
    <circle cx="170" cy="25" r="5" fill="#00e5ff" />
    <circle cx="170" cy="25" r="6" fill="none" stroke="#00e5ff" stroke-width="1.5" class="ring-anim" />
  </g>

  <!-- Метрика 3: Шифрование и безопасность -->
  <g transform="translate(455, 50)">
    <rect width="195" height="105" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
    <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">SECURITY CIPHER</text>
    <text x="15" y="65" fill="#f43f5e" font-family="sans-serif" font-size="24" font-weight="900">AES-256</text>
    <text x="15" y="88" fill="#fb7185" font-family="sans-serif" font-size="11">mTLS Zero-Trust &amp; TLS 1.3</text>
    <circle cx="170" cy="25" r="5" fill="#f43f5e" />
    <circle cx="170" cy="25" r="6" fill="none" stroke="#f43f5e" stroke-width="1.5" class="ring-anim" />
  </g>

  <!-- Метрика 4: Политика отсутствия логов -->
  <g transform="translate(670, 50)">
    <rect width="205" height="105" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1" />
    <text x="15" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">PRIVACY POLICY</text>
    <text x="15" y="65" fill="#eab308" font-family="sans-serif" font-size="26" font-weight="900">ZERO-LOG</text>
    <text x="15" y="88" fill="#fde047" font-family="sans-serif" font-size="11">RAM Ephemeral &amp; L3 Sinkhole</text>
    <circle cx="180" cy="25" r="5" fill="#eab308" />
    <circle cx="180" cy="25" r="6" fill="none" stroke="#eab308" stroke-width="1.5" class="ring-anim" />
  </g>
</svg>
