name: 🐛 Отчёт об ошибке (Bug Report)
description: Создать отчёт о проблеме или сбое в работе Obxodka
title: "[BUG]: "
labels: [ "bug", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшить **Obxodka**! Пожалуйста, заполните форму ниже.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Укажите версию и номер билда (например, v6.2.0 Build 92)
      placeholder: v6.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система / способ установки
      description: На каком устройстве произошла ошибка?
      options:
        - Windows 11 (Microsoft Store)
        - Windows 11 (Setup EXE / GitHub Release)
        - Windows 10 (Microsoft Store / Setup EXE)
        - Android (Google Play)
        - Android (APK / Sideload)
        - Сборка из исходников (Self-built)
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Провайдер / сеть (опционально)
      description: Например, МТС LTE, Ростелеком, Дом.ру — помогает отслеживать особенности ТСПУ
      placeholder: Не указано
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Описание ошибки
      description: Чёткое и понятное описание проблемы.
      placeholder: Опишите, что пошло не так...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги для воспроизведения
      description: Как повторить проблему?
      value: |
        1. Открыть приложение
        2. Нажать '...'
        3. Наблюдать ошибку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншоты
      description: Приложите фрагмент лога или скриншот. Перед отправкой удалите личный email, JWT-токены и любые приватные данные!
    validations:
      required: false
