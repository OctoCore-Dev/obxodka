# =============================================================================
# Оптимизированные правила R8 для .NET 11 MAUI (обфускация/сжатие DEX >= 25%)
# Без широких wildcard-запретов на androidx.*, material.*, gms.*, mlkit.* —
# их consumer-rules и aapt2/xamarin keep-правила подхватываются R8 автоматически.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Core .NET Android / JNI Bridge (только точки входа JNI и Java-обёртки)
# -----------------------------------------------------------------------------
-keep class crc64** { *; }
-keep class mono.android.** { *; }
-keep class mono.MonoRuntimeProvider { *; }
-keep class mono.MonoPackageManager { *; }
-keep class net.dot.** { *; }

-keepclasseswithmembernames class * {
    native <methods>;
}

# -----------------------------------------------------------------------------
# 2. Точки входа Obxodka Android (VpnService, TileService, Activity, Receiver)
# -----------------------------------------------------------------------------
-keep class obxodka.OctopusVpnService { *; }
-keep class obxodka.OctopusTileService { *; }
-keep class obxodka.AssistantActionActivity { *; }
-keep class * extends android.net.VpnService { *; }
-keep class * extends android.service.quicksettings.TileService { *; }
-keep class * extends android.app.Application { *; }
-keep class * extends android.app.Activity { *; }
-keep class * extends android.app.Service { *; }
-keep class * extends android.content.BroadcastReceiver { *; }

# -----------------------------------------------------------------------------
# 3. SkiaSharp, MediaElement (Media3 ExoPlayer) & Play Billing JNI callbacks
# -----------------------------------------------------------------------------
-keep class skiasharp.** { *; }
-keep class androidx.media3.exoplayer.ExoPlayer { public *; }
-keep class androidx.media3.exoplayer.ExoPlayer$Builder { public *; }
-keep class androidx.media3.ui.PlayerView { public *; }
-keep class androidx.media3.common.MediaItem { public *; }
-keep class plugin.inappbilling.** { *; }
-keepclassmembers class com.android.billingclient.api.* {
    public *;
}

# -----------------------------------------------------------------------------
# 4. AndroidX Edge-to-Edge API, вызываемые напрямую из MainActivity
# -----------------------------------------------------------------------------
-keep class androidx.core.view.WindowCompat { public *; }
-keep class androidx.core.view.ViewCompat { public *; }
-keep class androidx.core.view.WindowInsetsCompat { public *; }
-keep class androidx.core.view.WindowInsetsCompat$Builder { public *; }
-keep class androidx.core.view.WindowInsetsCompat$Type { public *; }
-keep class androidx.core.view.WindowInsetsControllerCompat { public *; }

# -----------------------------------------------------------------------------
# 5. Диагностика стектрейсов и enum-контракты для .NET Reflection
# -----------------------------------------------------------------------------
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions,SourceFile,LineNumberTable

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# -----------------------------------------------------------------------------
# 6. Оптимизация и подавление предупреждений для опциональных compile-only ссылок
# -----------------------------------------------------------------------------
-allowaccessmodification
-dontwarn androidx.**
-dontwarn com.google.**
-dontwarn com.android.billingclient.**
-dontwarn com.microsoft.maui.**
-dontwarn communitytoolkit.**
-dontwarn net.dot.**
-dontwarn kotlin.**
-dontwarn kotlinx.**
-dontwarn org.codehaus.**
-dontwarn org.intellij.**
-dontwarn org.jetbrains.**
-dontwarn sun.misc.Unsafe
-dontnote **
