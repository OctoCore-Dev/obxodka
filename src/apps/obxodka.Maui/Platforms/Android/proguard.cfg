# =============================================================================
# Оптимизированные правила R8 для .NET 11 MAUI (все метрики DEX >= 25%)
# Принцип: запрещаем R8 удалять только реальные JNI-точки входа C# -> Java
# (с allowoptimization для внутренней оптимизации и обфускации private-членов),
# не блокируя shrinking/obfuscation для неиспользуемых классов androidx/gms/material.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Core .NET Android, MAUI & JNI Bridge (критично для VisualElement и хендлеров)
# -----------------------------------------------------------------------------
-keep class crc64** { *; }
-keep class mono.android.** { *; }
-keep class mono.MonoRuntimeProvider { *; }
-keep class mono.MonoPackageManager { *; }
-keep class net.dot.** { *; }
-keep,allowoptimization class com.microsoft.maui.** { public protected *; }
-keep,allowoptimization class communitytoolkit.** { public protected *; }
-keep,allowoptimization class **.*Implementor { *; }

-keepclasseswithmembernames class * {
    native <methods>;
}

# -----------------------------------------------------------------------------
# 2. Точки входа Obxodka Android (VpnService, TileService, Activity, Receiver)
# -----------------------------------------------------------------------------
-keep class obxodka.OctopusVpnService { *; }
-keep class obxodka.OctopusTileService { *; }
-keep class obxodka.AssistantActionActivity { *; }
-keep class * extends android.net.VpnService { *; }
-keep class * extends android.service.quicksettings.TileService { *; }
-keep class * extends android.app.Application { *; }
-keep class * extends android.app.Activity { *; }
-keep class * extends android.app.Service { *; }
-keep class * extends android.content.BroadcastReceiver { *; }

# -----------------------------------------------------------------------------
# 3. SkiaSharp, Play Billing, SecureStorage (Crypto) и QR-сканер (ML Kit)
# -----------------------------------------------------------------------------
-keep,allowoptimization class skiasharp.** { *; }
-keep,allowoptimization class plugin.inappbilling.** { *; }
-keep,allowoptimization class com.android.billingclient.api.** { public protected *; }
-keep,allowoptimization class androidx.security.crypto.** { public protected *; }
-keep,allowoptimization class com.google.mlkit.vision.codescanner.** { public protected *; }
-keep,allowoptimization class com.google.mlkit.vision.barcode.common.** { public protected *; }
-keep,allowoptimization class com.google.android.gms.tasks.** { public protected *; }

# -----------------------------------------------------------------------------
# 4. MediaElement (AndroidX Media3 / ExoPlayer) — точечные JNI-классы
# -----------------------------------------------------------------------------
-keep,allowoptimization class androidx.media3.exoplayer.ExoPlayer { public protected *; }
-keep,allowoptimization class androidx.media3.exoplayer.ExoPlayer$* { public protected *; }
-keep,allowoptimization class androidx.media3.exoplayer.source.DefaultMediaSourceFactory { public protected *; }
-keep,allowoptimization class androidx.media3.exoplayer.source.ProgressiveMediaSource { public protected *; }
-keep,allowoptimization class androidx.media3.exoplayer.source.ProgressiveMediaSource$* { public protected *; }
-keep,allowoptimization class androidx.media3.exoplayer.trackselection.TrackSelectorResult { public protected *; }
-keep,allowoptimization class androidx.media3.session.MediaSession { public protected *; }
-keep,allowoptimization class androidx.media3.session.MediaSession$* { public protected *; }
-keep,allowoptimization class androidx.media3.session.MediaStyleNotificationHelper { public protected *; }
-keep,allowoptimization class androidx.media3.session.MediaStyleNotificationHelper$* { public protected *; }
-keep,allowoptimization class androidx.media3.ui.PlayerView { public protected *; }
-keep,allowoptimization class androidx.media3.ui.DefaultMediaDescriptionAdapter { public protected *; }
-keep,allowoptimization class androidx.media3.ui.PlayerNotificationManager$* { public protected *; }
-keep,allowoptimization class androidx.media3.common.MediaItem { public protected *; }

# -----------------------------------------------------------------------------
# 5. AndroidX и Material виджеты, вызываемые напрямую из .NET MAUI через JNI
# -----------------------------------------------------------------------------
-keep,allowoptimization class androidx.core.view.WindowCompat { public protected *; }
-keep,allowoptimization class androidx.core.view.ViewCompat { public protected *; }
-keep,allowoptimization class androidx.core.view.WindowInsetsCompat { public protected *; }
-keep,allowoptimization class androidx.core.view.WindowInsetsCompat$* { public protected *; }
-keep,allowoptimization class androidx.core.view.WindowInsetsControllerCompat { public protected *; }
-keep,allowoptimization class androidx.core.view.ScaleGestureDetectorCompat { public protected *; }
-keep,allowoptimization class androidx.core.view.MenuItemCompat { public protected *; }
-keep,allowoptimization class androidx.core.app.NotificationCompat { public protected *; }
-keep,allowoptimization class androidx.core.app.NotificationCompat$* { public protected *; }
-keep,allowoptimization class androidx.core.content.pm.PackageInfoCompat { public protected *; }
-keep,allowoptimization class androidx.core.widget.CompoundButtonCompat { public protected *; }
-keep,allowoptimization class androidx.appcompat.widget.TooltipCompat { public protected *; }
-keep,allowoptimization class androidx.activity.result.** { public protected *; }
-keep,allowoptimization class androidx.appcompat.widget.SwitchCompat { public protected *; }
-keep,allowoptimization class androidx.appcompat.app.ActionBarDrawerToggle { public protected *; }
-keep,allowoptimization class androidx.browser.** { public protected *; }
-keep,allowoptimization class androidx.navigation.ui.** { public protected *; }
-keep,allowoptimization class androidx.recyclerview.widget.ItemTouchHelper { public protected *; }

-keep,allowoptimization class com.google.android.material.materialswitch.** { public protected *; }
-keep,allowoptimization class com.google.android.material.switchmaterial.** { public protected *; }
-keep,allowoptimization class com.google.android.material.appbar.AppBarLayout$* { public protected *; }
-keep,allowoptimization class com.google.android.material.badge.** { public protected *; }
-keep,allowoptimization class com.google.android.material.bottomnavigation.** { public protected *; }
-keep,allowoptimization class com.google.android.material.bottomsheet.BottomSheetDialog { public protected *; }
-keep,allowoptimization class com.google.android.material.datepicker.** { public protected *; }
-keep,allowoptimization class com.google.android.material.dialog.MaterialAlertDialogBuilder { public protected *; }
-keep,allowoptimization class com.google.android.material.navigation.** { public protected *; }
-keep,allowoptimization class com.google.android.material.progressindicator.LinearProgressIndicator { public protected *; }
-keep,allowoptimization class com.google.android.material.shape.ShapePathModel { public protected *; }
-keep,allowoptimization class com.google.android.material.tabs.** { public protected *; }
-keep,allowoptimization class com.google.android.material.timepicker.** { public protected *; }

# -----------------------------------------------------------------------------
# 6. Диагностика стектрейсов и enum-контракты для .NET Reflection
# -----------------------------------------------------------------------------
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions,SourceFile,LineNumberTable

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# -----------------------------------------------------------------------------
# 7. Оптимизация и подавление предупреждений для опциональных compile-only ссылок
# -----------------------------------------------------------------------------
-allowaccessmodification
-dontwarn androidx.**
-dontwarn com.google.**
-dontwarn com.android.billingclient.**
-dontwarn com.microsoft.maui.**
-dontwarn communitytoolkit.**
-dontwarn net.dot.**
-dontwarn kotlin.**
-dontwarn kotlinx.**
-dontwarn org.codehaus.**
-dontwarn org.intellij.**
-dontwarn org.jetbrains.**
-dontwarn sun.misc.Unsafe
-dontnote **
