# =============================================================================
# Master ProGuard / R8 Rules for .NET MAUI Release Obfuscation & Shrinking
# Project: obxodka (OctoCore)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Core .NET MAUI & JNI Java Bridge (Prevents TypeInitializationException)
# -----------------------------------------------------------------------------
-keep class crc64** { *; }
-keepclassmembers class crc64** { *; }
-keep interface crc64** { *; }
-keepclassmembers interface crc64** { *; }

-keep class mono.** { *; }
-keepclassmembers class mono.** { *; }
-keep interface mono.** { *; }
-keepclassmembers interface mono.** { *; }

-keep class com.microsoft.maui.** { *; }
-keepclassmembers class com.microsoft.maui.** { *; }
-keep interface com.microsoft.maui.** { *; }
-keepclassmembers interface com.microsoft.maui.** { *; }

-keep class Microsoft.Maui.** { *; }
-keepclassmembers class Microsoft.Maui.** { *; }
-keep interface Microsoft.Maui.** { *; }

# -----------------------------------------------------------------------------
# 2. Obxodka Application, VPN Service & JNI Callbacks
# -----------------------------------------------------------------------------
-keep class obxodka.** { *; }
-keepclassmembers class obxodka.** { *; }
-keep interface obxodka.** { *; }

-keep class * extends android.app.Application { *; }
-keep class * extends android.app.Activity { *; }
-keep class * extends android.app.Service { *; }
-keep class * extends android.content.BroadcastReceiver { *; }

# VPN: VpnService — критично, иначе Play Market release упадёт при подключении
-keep class * extends android.net.VpnService { *; }
-keepclassmembers class * extends android.net.VpnService { *; }

# -----------------------------------------------------------------------------
# 3. Community Toolkit & MediaElement (AndroidX Media3 / ExoPlayer for Theme Video)
# -----------------------------------------------------------------------------
-keep class communitytoolkit.** { *; }
-keepclassmembers class communitytoolkit.** { *; }
-keep interface communitytoolkit.** { *; }

-keep class androidx.media3.** { *; }
-keepclassmembers class androidx.media3.** { *; }
-keep interface androidx.media3.** { *; }
-dontwarn androidx.media3.**

-keep class com.google.android.exoplayer2.** { *; }
-keepclassmembers class com.google.android.exoplayer2.** { *; }
-keep interface com.google.android.exoplayer2.** { *; }
-dontwarn com.google.android.exoplayer2.**

# -----------------------------------------------------------------------------
# 4. SkiaSharp Canvas & Vector Graphics
# -----------------------------------------------------------------------------
-keep class com.google.skia.** { *; }
-keepclassmembers class com.google.skia.** { *; }
-keep interface com.google.skia.** { *; }

-keep class skiasharp.** { *; }
-keepclassmembers class skiasharp.** { *; }
-keep interface skiasharp.** { *; }

# -----------------------------------------------------------------------------
# 5. In-App Billing (Google Play Store Subscriptions & Purchases)
# -----------------------------------------------------------------------------
-keep class com.android.vending.billing.** { *; }
-keepclassmembers class com.android.vending.billing.** { *; }
-keep interface com.android.vending.billing.** { *; }

-keep class com.android.billingclient.** { *; }
-keepclassmembers class com.android.billingclient.** { *; }
-keep interface com.android.billingclient.** { *; }
-keepclassmembers interface com.android.billingclient.** { *; }

# BillingClient: конструктор и методы обратного вызова — Play Billing SDK 6+
-keepclassmembers class com.android.billingclient.api.* {
    public *;
}

-keep class plugin.inappbilling.** { *; }
-keepclassmembers class plugin.inappbilling.** { *; }
-keep interface plugin.inappbilling.** { *; }

# -----------------------------------------------------------------------------
# 6. AndroidX Support & Google Material Components
# -----------------------------------------------------------------------------
-keep class androidx.** { *; }
-keepclassmembers class androidx.** { *; }
-keep interface androidx.** { *; }
-keepclassmembers interface androidx.** { *; }
-dontwarn androidx.**

# AndroidX Core WindowCompat / Edge-to-Edge (используется в MainActivity)
-keep class androidx.core.view.WindowCompat { *; }
-keep class androidx.core.view.ViewCompat { *; }
-keep class androidx.core.view.WindowInsetsCompat { *; }
-keep class androidx.core.view.WindowInsetsControllerCompat { *; }

-keep class com.google.android.material.** { *; }
-keepclassmembers class com.google.android.material.** { *; }
-keep interface com.google.android.material.** { *; }
-dontwarn com.google.android.material.**

# -----------------------------------------------------------------------------
# 7. gRPC / Protobuf (используется для WireGuard/VPN туннеля)
# -----------------------------------------------------------------------------
-keep class com.google.protobuf.** { *; }
-keepclassmembers class com.google.protobuf.** { *; }
-keep interface com.google.protobuf.** { *; }
-dontwarn com.google.protobuf.**

-keep class io.grpc.** { *; }
-keepclassmembers class io.grpc.** { *; }
-keep interface io.grpc.** { *; }
-dontwarn io.grpc.**

# -----------------------------------------------------------------------------
# 8. Reflection, Annotations & Line Numbers (Preserves Diagnostics & Stack Traces)
# -----------------------------------------------------------------------------
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
-keepattributes SourceFile,LineNumberTable

# Сохраняем имена классов в исключениях (иначе в Crashlytics будет "a.b.c")
-keepattributes Exceptions

# -----------------------------------------------------------------------------
# 9. Enum-классы (R8 агрессивно их инлайнит, что ломает Reflection в .NET)
# -----------------------------------------------------------------------------
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# -----------------------------------------------------------------------------
# 10. General R8 Options: Suppress warnings for optional build-time classes
# -----------------------------------------------------------------------------
-dontwarn **
-dontnote **
-ignorewarnings

# -----------------------------------------------------------------------------
# 11. Google Play Services (Tasks, Common, Dynamite) & ML Kit Barcode / Code Scanner
# -----------------------------------------------------------------------------
-keep class com.google.android.gms.** { *; }
-keepclassmembers class com.google.android.gms.** { *; }
-keep interface com.google.android.gms.** { *; }
-keepclassmembers interface com.google.android.gms.** { *; }

-keep class com.google.mlkit.** { *; }
-keepclassmembers class com.google.mlkit.** { *; }
-keep interface com.google.mlkit.** { *; }
-keepclassmembers interface com.google.mlkit.** { *; }

-keep class com.google.android.datatransport.** { *; }
-keepclassmembers class com.google.android.datatransport.** { *; }
-keep interface com.google.android.datatransport.** { *; }

-dontwarn com.google.android.gms.**
-dontwarn com.google.mlkit.**
-dontwarn com.google.android.datatransport.**
